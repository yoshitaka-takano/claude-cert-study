<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CCAR-P 弱点特化 30問</title><style>
:root{--bg:#12100e;--pn:#1c1917;--pn2:#231f1c;--line:#39322c;--tx:#f0ece7;--mu:#a79e94;
--ac:#d97757;--ok:#4ea36a;--bad:#d1594f;--k:1.15}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
line-height:1.6;padding-bottom:100px}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
h1{font-size:calc(23px*var(--k));margin:20px 0 6px;line-height:1.35}
h2{font-size:calc(18px*var(--k));margin:24px 0 10px}
p,li{font-size:calc(15px*var(--k))}
.sub{color:var(--mu);font-size:calc(14px*var(--k));margin:0 0 14px}
.card{background:var(--pn);border:1px solid var(--line);border-radius:13px;padding:16px;margin:12px 0}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:10px;
padding:12px 18px;font-size:calc(15px*var(--k));font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.35}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--tx);font-weight:600}
.btn.sm{padding:8px 13px;font-size:calc(13px*var(--k))}
.btn.on{background:#3a2116;border-color:var(--ac);color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.bar{position:fixed;top:0;left:0;right:0;background:rgba(18,16,14,.97);
border-bottom:1px solid var(--line);z-index:20;backdrop-filter:blur(8px)}
.bar .in{max-width:820px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:10px}
.pad{height:54px}
.pb{height:5px;background:var(--pn2);border-radius:3px;overflow:hidden;flex:1;min-width:60px}
.pb i{display:block;height:100%;background:var(--ac)}
.pos{color:var(--mu);font-size:calc(13px*var(--k));white-space:nowrap}
.dm{display:inline-block;background:var(--pn2);border:1px solid var(--line);border-radius:6px;
padding:3px 9px;font-size:calc(12px*var(--k));color:var(--mu)}
.tag{display:inline-block;background:#3a2116;border:1px solid var(--ac);color:var(--ac);
border-radius:6px;padding:3px 9px;font-size:calc(12px*var(--k));font-weight:700;margin-left:6px}
.stem{font-size:calc(16px*var(--k));margin:13px 0 15px;line-height:1.7}
.opt{display:block;background:var(--pn);border:1px solid var(--line);border-radius:11px;
padding:13px 15px;margin:9px 0;cursor:pointer;font-size:calc(15px*var(--k));line-height:1.6}
.opt.sel{border-color:var(--ac);background:#241812}
.opt .L{font-weight:800;color:var(--mu);margin-right:8px}
.opt.sel .L{color:var(--ac)}
.opt.ok{border-color:var(--ok);background:#0f2213}
.opt.ng{border-color:var(--bad);background:#25100f}
.opt.dis{cursor:default}
.exp{background:var(--pn2);border-left:3px solid var(--ac);border-radius:0 9px 9px 0;
padding:13px 15px;margin:12px 0;font-size:calc(14px*var(--k));line-height:1.75}
.exp .pt{color:var(--ac);font-weight:700;margin-top:10px}
.vd{font-weight:800;font-size:calc(16px*var(--k));margin:12px 0 0}
.vd.o{color:var(--ok)} .vd.x{color:var(--bad)}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,16,14,.97);
border-top:1px solid var(--line);z-index:20;backdrop-filter:blur(8px)}
.nav .in{max-width:820px;margin:0 auto;padding:10px 14px;display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px;margin:12px 0}
.gc{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--pn);
display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;
font-size:calc(14px*var(--k))}
.gc.ok{background:#12301c;border-color:#2f6b45;color:#8fd6a6}
.gc.ng{background:#2e1310;border-color:#7a332c;color:#e59a92}
.gc.cur{outline:2px solid var(--ac)}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:calc(14px*var(--k))}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mu);font-weight:600;font-size:calc(13px*var(--k))}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:calc(38px*var(--k));font-weight:800;line-height:1.1;margin:4px 0}
.fs button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
background:var(--pn);color:var(--tx);font-size:15px;font-weight:700;cursor:pointer}
.note{background:#332b12;border:1px solid #6b5a2f;border-radius:11px;padding:13px 15px;
margin:12px 0;font-size:calc(14px*var(--k));color:#e8d9a8;line-height:1.75}
</style></head><body><div id="app"></div><script>
var Q=[{"d": "D3", "q": "A logistics agent streams responses token by token. After three tool calls were added, users see nothing for 8 to 15 seconds and assume the system has crashed. The underlying tool latency cannot be reduced this quarter. What should the architect do first?", "o": ["Increase the client timeout and add an automatic retry so the request is not dropped during the silent period", "Disable streaming and show a single spinner until the full response is ready", "Emit structured progress events for each tool invocation on the same stream so the UI can render step level status while tools run", "Move tool execution to a background job and have the client poll a results endpoint every 5 seconds", "Instruct the model to write a short preamble sentence before each tool call so some text appears immediately"], "a": [2], "e": "問題はトークン生成の遅さではなく、ツール実行中にストリームへ何も流れないことによる無反応状態です。同じストリーム上に「ツール開始」「完了」などの構造化イベントを流せば、ツール遅延を短縮せずに体感の停止が消えます。Eはモデルの振る舞いに依存するため保証されず、前置きの後にやはり数秒の沈黙が残ります。", "p": "体感遅延は「速くする」ではなく「進行状況を見せる」で解く。"}, {"d": "D3", "q": "A claims agent must call a mainframe service that takes 25 to 60 seconds and occasionally 3 minutes. The agent request currently blocks for the whole duration and users abandon the session. What integration pattern should the architect apply?", "o": ["Raise the HTTP timeout on the agent to 5 minutes and keep the synchronous call", "Retry the call after 30 seconds if it has not returned", "Cache the last successful mainframe response and return it while the new call runs", "Split the mainframe call into smaller calls so each one returns faster", "Make the call asynchronous: the tool returns a job handle immediately, the agent tells the user the work is in progress, and completion arrives by callback or polling"], "a": [4], "e": "数十秒から数分かかる処理を同期呼び出しのまま扱うと、タイムアウト値をいくら上げても待たされる体験は変わりません。ジョブ化して即座にハンドルを返し、完了を非同期に届けるのが正解です。Cは古い結果を新しい問い合わせの答えとして返すことになり、正確性を壊します。Dはメインフレーム側の処理を分割できる前提を勝手に置いています。", "p": "長時間処理は同期のまま粘らず、ジョブ化して非同期に返す。"}, {"d": "D3", "q": "An operations team must classify 2.4 million historical support tickets into 40 categories. No user is waiting for the result and there is no same day deadline. Cost is the main constraint. What should the architect choose?", "o": ["Run the classification through the same real time endpoint the live agent uses, with a concurrency limit", "Use the Batch API for the historical backlog and keep the real time endpoint only for newly arriving tickets", "Fine tune a smaller model and run inference on internal GPUs", "Sample 10 percent of the tickets and extrapolate the category distribution", "Request a higher rate limit on the production key and process everything overnight"], "a": [1], "e": "待っている人がいない大量処理は、リアルタイム性を捨ててバッチに回すのが定石です。単価が下がり、本番トラフィックへの圧迫も避けられます。Eはレート上限を上げるだけで単価は下がらず、本番と同じ枠を食い潰します。Dは「全件を分類する」という要件そのものを勝手に縮小しています。", "p": "待つ人がいない大量処理はバッチ。リアルタイム枠を使わない。"}, {"d": "D3", "q": "During a month end peak an agent begins receiving 429 responses. The current client retries immediately up to 5 times. Error volume gets worse as the peak intensifies. What should the architect change first?", "o": ["Request a permanent rate limit increase and keep the retry logic as it is", "Remove the retries so failures surface to the user immediately", "Route overflow traffic to a second API key belonging to another team", "Replace immediate retries with exponential backoff plus jitter, honor the Retry-After header, and queue work that is not time critical", "Reduce max_tokens on each request so responses finish faster"], "a": [3], "e": "即時リトライは輻輳時に負荷を増幅させ、429をさらに悪化させます。指数バックオフとジッター、Retry-After の尊重が標準的な対処です。Cは他チームの枠を奪う行為で、コスト帰属も壊れます。Aは上限を上げても瞬間的なスパイク形状は変わらないため、根本対処になりません。", "p": "429への第一手は上限交渉ではなく、バックオフとキューイング。"}, {"d": "D3", "q": "An MCP server exposes an internal HR system. It authenticates with a single service account that has read access to every employee record, so any user of the agent can reach any record. What should the architect require?", "o": ["Propagate the end user's identity to the MCP server and have it authorize each call against that user's own entitlements", "Add a system prompt instruction telling the model to look up only the current user's record", "Log every lookup and review the logs weekly for inappropriate access", "Restrict the service account to read only so that no data can be modified", "Ask the user to confirm before each lookup"], "a": [0], "e": "権限がサービスアカウント単位に潰れている状態は、モデルの指示や事後ログでは埋められません。エンドユーザーの識別情報を伝播し、既存の権限体系で1件ずつ認可するのが唯一の構造的解決です。Bはモデルの遵守に依存する保証のない統制、Cは事後検知にすぎず、Dは読み取り権限の問題を何も解決していません。", "p": "権限の問題はモデルではなく、認可層で解く。identity propagation。"}, {"d": "D3", "q": "An analytics agent has a run_sql tool that accepts any SELECT statement against the production replica. Reviewers are concerned about expensive full scans and about the model reading columns it should not see. What should the architect do?", "o": ["Add a system prompt rule listing the tables the model is allowed to query", "Set a query timeout so that expensive scans are cancelled", "Send each generated SQL statement through a model based validator before execution", "Give the tool a read only database user and keep the free form SQL interface", "Replace the free form tool with a small set of named, parameterized query tools that expose only approved columns and joins"], "a": [4], "e": "任意SQLを受け付けるツールは、その時点で攻撃面と誤操作面の両方を開いています。ツールの粒度を「承認済みの問い合わせ」に絞れば、列の露出もコストも設計時に決まります。Cはモデルでモデルを検証する構造で、決定的な保証になりません。Dは読み取り専用にしても、見てはいけない列は読めたままです。", "p": "自由度の高すぎるツールは、狭く名前の付いたツールに置き換える。"}, {"d": "D3", "q": "Select TWO. A new MCP server will expose write operations to a CRM: creating opportunities, updating amounts and deleting records. Which two controls should the architect require before release?", "o": ["Require the model to restate the intended change in natural language before executing it", "Scope the credential so that destructive operations the workflow does not need are not exposed at all", "Log all write operations to a central audit store and review them monthly", "Set a low temperature so the model behaves more predictably on writes", "Require explicit human confirmation for irreversible operations, carrying an idempotency key so that a retry cannot duplicate the change"], "a": [1, 4], "e": "書き込み系ツールの統制は「そもそも露出しない」（最小権限）と「取り返しがつかない操作は人が承認し、再送で二重実行されない」（冪等キー）の二段構えです。Aはモデルの発話に依存し保証がありません。Cは事後検知。Dは温度を下げても書き込み権限は残ります。", "p": "書き込み系は最小権限＋不可逆操作の人的承認＋冪等キー。"}, {"d": "D3", "q": "An order status agent depends on a fulfillment API that has had two 40 minute outages this quarter. During an outage every conversation fails with a generic error. The API team cannot improve availability this year. What should the architect do?", "o": ["Retry the fulfillment API more aggressively during an outage", "Cache all order records locally and serve them permanently as the source of truth", "Add a circuit breaker with a defined degraded mode: the agent states that status is temporarily unavailable, still answers what it can, and offers a callback", "Take the agent offline automatically whenever the fulfillment API is down", "Have the model infer a likely order status from the conversation history"], "a": [2], "e": "可用性を上げられない依存先は、落ちる前提で設計します。サーキットブレーカーで無駄な再試行を止め、縮退時に何ができるかを定義するのが正解です。Aは障害中の相手をさらに叩きます。Dはエージェント全体を落とす過剰反応で、注文以外の会話まで失われます。Eはモデルに事実を捏造させる最悪の選択です。", "p": "可用性が上げられない依存先は、縮退動作を設計する。"}, {"d": "D3", "q": "An agent tool issues refunds. A network timeout leaves the caller unable to tell whether the refund was applied, and the current code retries. Finance has found duplicate refunds. What should the architect require?", "o": ["Stop retrying and escalate every timeout to a human", "Increase the timeout so the response has more time to return", "Have the agent call a check refund status tool before every retry", "Require the refund tool to accept an idempotency key, so that a repeated call with the same key returns the original result instead of issuing a second refund", "Wrap the refund in a database transaction on the agent side"], "a": [3], "e": "タイムアウトは「未実行」と「実行済みだが応答が届かなかった」を区別できません。冪等キーによってサーバー側が重複を吸収する設計にすれば、安全に再送できます。Cは状態確認と再送の間に競合が残ります。Eはエージェント側のトランザクションで、相手システムの二重実行は防げません。", "p": "リトライを安全にするのは冪等キー。タイムアウトは実行有無を区別できない。"}, {"d": "D3", "q": "A knowledge assistant over 300 thousand documents misses the correct passage about 25 percent of the time. When the correct passage is supplied manually, the model answers correctly almost every time. Where should the architect focus?", "o": ["The retrieval layer: chunking strategy, hybrid keyword plus vector search, and a reranking step", "The model: move to a larger model with stronger reasoning", "The prompt: instruct the model to say it does not know when it is unsure", "The context window: send more retrieved chunks on every query", "The evaluation: add more test questions so the problem can be measured more precisely"], "a": [0], "e": "「正しい文章を渡せば正答する」という観測が、モデルの能力ではなく検索の失敗であることを既に切り分けています。したがって手を入れるのは検索層です。Bはモデルを大きくしても、渡っていない情報は読めません。Dはチャンクを増やしてノイズを持ち込む対症療法です。", "p": "切り分け済みの観測を読む。正答できるならモデルではなく検索が原因。"}, {"d": "D3", "q": "A shared internal Claude platform serves 12 business units through one organization level API key. Finance cannot tell which unit drives spend, and one unit's traffic spike degrades the others. What should the architect implement?", "o": ["Ask each business unit to self report its expected monthly usage", "Per business unit keys or workspaces with independent limits, plus request level metadata so that usage and spend can be attributed and throttled separately", "A monthly chargeback split evenly across the 12 units", "A single global rate limit set low enough that no unit can spike", "A queue that serializes all requests so that no unit can starve another"], "a": [1], "e": "帰属できない共有鍵は、コスト管理と障害分離の両方を同時に壊します。単位ごとに鍵と上限を分けることで、両方が一度に解決します。Cは公平に見えて実態と乖離し、使わない部門が損をします。Dは全員を遅くする過剰統制、Eは直列化でスループットを捨てています。", "p": "共有鍵は帰属と分離を同時に壊す。単位ごとに鍵と上限を分ける。"}, {"d": "D3", "q": "A support assistant sends a 30,000 token policy manual, a 1,200 token system prompt and a short user question on every request. Latency and cost are both high. Prompt caching is enabled but the hit rate is near zero. What is the most likely cause?", "o": ["The cache TTL is too short for the traffic volume", "The manual exceeds the maximum cacheable size", "Caching does not apply when the request includes tool definitions", "The model version changed recently and invalidated the cache", "The variable content is placed before the stable content, so the cached prefix does not match between requests"], "a": [4], "e": "プロンプトキャッシュは前方一致（prefix）で効きます。可変部分が先頭に来ていると、以降がすべて別物と判定されヒットしません。順序を「安定した大きいもの → 可変の小さいもの」に直すのが対処です。Aは可能性としてはあり得ますが、ヒット率がほぼゼロという観測は順序ミスの典型的な症状です。", "p": "キャッシュは前方一致。安定 → 可変 の順に並べる。"}, {"d": "D3", "q": "A production agent is configured to always use the latest model alias. After an automatic upgrade, output formatting changed and a downstream parser began failing in production. What should the architect change?", "o": ["Add a retry so the parser attempts the parse again on malformed output", "Ask the model in the system prompt to double check its formatting", "Pin production to an explicit model version, and promote a new version only after it passes the evaluation suite in a staging environment", "Make the downstream parser tolerant of any format the model produces", "Subscribe to release announcements so the team can react faster next time"], "a": [2], "e": "本番が自動でモデルを切り替わる構成は、検証されていない変更が無告知で入る構成と同じです。バージョンを固定し、昇格をゲートで守ります。Aは同じ壊れた出力を再解析するだけ、Bはモデルの遵守に依存、Eは検知が早くなるだけで事故は防げません。", "p": "本番はモデルバージョンを固定し、評価スイート通過を昇格条件にする。"}, {"d": "D3", "q": "A drafting assistant streams long documents. Roughly 2 percent of sessions lose the connection midway and the user loses everything generated so far. What should the architect do?", "o": ["Reduce the maximum output length so that responses finish sooner", "Disable streaming so that partial output is never shown", "Automatically resend the same request when the connection drops", "Persist streamed output server side as it is produced, so that a reconnecting client can recover the partial result and continue from it", "Warn users not to navigate away during generation"], "a": [3], "e": "失われているのは「生成済みの成果物」であって接続そのものではありません。サーバー側に逐次保存すれば、再接続で回復できます。Cは同じ長文をもう一度生成することになり、コストと待ち時間が二重にかかります。Bは全員の体験を落として2パーセントに対処する過剰反応です。", "p": "ストリーミングの切断対策は、再送ではなくサーバー側の逐次永続化。"}, {"d": "D3", "q": "A document intake pipeline receives files at unpredictable times. Processing each file takes 40 to 90 seconds. The upstream system posts a file and expects an HTTP response within 5 seconds. What should the architect do?", "o": ["Accept the post, return 202 with a job id immediately, process asynchronously, and notify the upstream system by webhook when the result is ready", "Process the file synchronously and ask the upstream team to raise their timeout", "Return a partial result within 5 seconds and let the upstream system request the rest", "Pre process files nightly so that daytime requests are fast", "Reject files above a size threshold so that processing always fits within 5 seconds"], "a": [0], "e": "上流の5秒という制約と、処理の40から90秒という実態は同期では両立しません。受付と処理を分離し、202とジョブIDで即返し、完了はWebhookで通知します。Bは相手の制約を変えさせる依頼で、自分の設計課題を外部に押し付けています。Dは到着時刻が予測不能という前提と矛盾します。", "p": "上流の応答時間制約は、受付と処理の分離（202 + Webhook）で満たす。"}, {"d": "D6", "q": "An executive sponsor saw a demonstration built on a copy of production data and told the board the system is ready for a company wide rollout next month. The team knows the demo bypassed authorization, error handling and the approval workflow. What should the architect do?", "o": ["Proceed with the rollout and add the missing controls in parallel", "Give the sponsor a written gap list separating what the demo proved from what production requires, with the effort and time each gap needs, and propose a scoped first release", "Ask the sponsor to retract the statement to the board", "Build the missing controls quietly and inform the sponsor once they are ready", "Escalate to the sponsor's manager that the timeline is unrealistic"], "a": [1], "e": "スポンサーは嘘をついたのではなく、デモが何を証明していないかを知らないだけです。アーキテクトの仕事は、証明済みと未証明の境界を文書で可視化し、代替案（縮小した初回リリース）を示すことです。Cは相手の面子を潰すだけで前に進みません。Eは順序が早すぎ、Dは情報を隠して信頼を損ねます。", "p": "期待のズレは、否定でも黙認でもなく「証明済みと未証明の線引き＋代替案」で扱う。"}, {"d": "D6", "q": "Six weeks after launch, the project team credits a Claude based invoice exception handler with a 30 percent reduction in processing time. During the same period the finance team also removed two manual approval steps. The CFO asks whether the 30 percent is real. What should the architect say?", "o": ["Yes, the timing matches the launch closely enough to attribute the gain", "No, the gain should be attributed to the process change because that explanation is simpler", "The gain cannot be measured, so the team should track adoption instead", "The credit should be split evenly between the two changes", "The two changes are confounded, so the current number cannot be attributed to either. Propose a way to separate them, such as comparing invoice types the agent does not handle, or running a holdout"], "a": [4], "e": "同時期に二つの変更が入っており、片方に帰属させる根拠がありません。正しい対応は結論を保留し、分離する測定方法を提案することです。Dの折半は一見公平ですが、根拠のない数字を新たに作る行為です。Cは測定を諦めており、採用率は効果の代理指標になりません。", "p": "交絡している効果は、断定も否定もせず「分離する測り方」を提案する。"}, {"d": "D6", "q": "A successful pilot is moving to the operations team. The build team currently owns the prompts, the evaluation suite and the incident runbook informally. What should the architect insist on before handover?", "o": ["A named owner for each artifact, an evaluation suite the operations team can run themselves, and a runbook covering the failure modes actually seen during the pilot", "A three day knowledge transfer workshop covering the architecture", "Freezing the prompts so that the operations team never needs to change them", "Keeping the build team on call indefinitely as second line support", "A wiki page documenting everything the build team knows"], "a": [0], "e": "引き継ぎの失敗は知識不足ではなく、所有者不在から起きます。成果物ごとに名前の付いたオーナーと、運用チーム自身が実行できる評価手段があって初めて自立します。Bは一過性、Eは文書化だけで所有権が移りません。Cは変更の必要性を否定する非現実的な前提です。", "p": "引き継ぎの本質は知識移転ではなく、所有権と実行可能な検証手段の移転。"}, {"d": "D6", "q": "Anthropic announces that a model used in four production workflows will be retired in six months. What should the architect do first?", "o": ["Wait until closer to the deadline, since the workflows are stable today", "Immediately switch all four workflows to the newest model", "Ask for an extension so the workflows can remain on the current model", "Inventory the four workflows, run each one's evaluation suite against the replacement model, and schedule migration by risk and effort", "Rewrite the prompts so that they are model agnostic"], "a": [3], "e": "廃止予定は既知のリスクであり、最初にすべきは影響範囲の棚卸しと、評価スイートによる差分の実測です。Bは検証なしの一斉切り替えで、まさに前問のバージョン固定の教訓に反します。Eは望ましい方向ですが、まず現状把握が先です。", "p": "モデル廃止への第一手は、棚卸しと評価スイートによる差分測定。"}, {"d": "D5", "q": "An internal IT support agent answers from a wiki that any employee can edit, and it can reset passwords through a tool. A reviewer notes that wiki content flows directly into the model's context. What is the most serious risk and the right control?", "o": ["Stale content. Add a freshness check on wiki pages", "Copyright exposure. Restrict which pages may be indexed", "Indirect prompt injection: wiki text could instruct the agent to reset another user's password. Treat retrieved content as untrusted data and gate the password reset tool behind independent authorization", "Cost. Limit how many wiki pages are retrieved per query", "Hallucination. Instruct the model to cite the wiki page it used"], "a": [2], "e": "誰でも編集できるコンテンツがコンテキストに入り、かつ副作用のあるツールが存在する。この二つが揃った時点で間接プロンプトインジェクションが最大のリスクです。取得コンテンツは常に「データであって命令ではない」として扱い、危険なツールはモデルの判断とは独立した認可で守ります。", "p": "外部から取得した内容は命令ではなくデータ。副作用のあるツールは独立に認可する。"}, {"d": "D5", "q": "Select TWO. An operations agent can restart services, scale clusters and delete stale customer data. Which two controls should the architect require?", "o": ["Remove the delete capability from the agent entirely and route deletions through the existing reviewed process", "Ask the model to explain its reasoning before each destructive action", "Run the agent at a lower temperature for destructive operations", "Require human approval for any action that cannot be reversed, recorded against the specific action and its parameters", "Produce a nightly report of every action the agent took"], "a": [0, 3], "e": "不可逆な操作は「そもそも持たせない」か「人が個別に承認する」のどちらかで守ります。Bは説明を求めるだけで実行は止まりません。Cは温度を下げても削除権限は残ります。Eは事後報告で、削除済みのデータは戻りません。", "p": "不可逆操作は、能力を外すか個別承認を挟むか。説明も温度も統制ではない。"}, {"d": "D5", "q": "To debug quality issues, a team logs full request and response payloads, including customer messages, to a shared observability platform readable by the whole engineering organization. What should the architect require?", "o": ["Shorten the log retention period to 30 days", "Redact or tokenize personal data before it leaves the application, and restrict access to any store that still holds it", "Ask engineers not to view customer data unless they are debugging", "Move the logs to an encrypted bucket", "Log only the responses, since the customer messages are the sensitive part"], "a": [1], "e": "個人情報は出ていく前に落とすのが原則です。保持期間の短縮も暗号化も、閲覧できる範囲が広いままでは統制になりません。Cは運用者の善意に依存する統制、Eは応答にも顧客情報が含まれ得るため誤りです。", "p": "個人情報はアプリケーションを出る前にマスクする。保管側の対策は補助でしかない。"}, {"d": "D5", "q": "A loan pre screening assistant produces a recommendation that a human reviewer approves. Reviewers now approve 98 percent of recommendations within seconds. What should the architect conclude?", "o": ["The system is working well, since agreement is high", "The reviewer pool can be reduced to one person to save cost", "The model is accurate enough that the human step can be removed", "Approval speed should be tracked as a productivity metric", "The review has become rubber stamping and is no longer a real control. Measure reviewer disagreement on seeded incorrect cases and redesign the step around the decisions that actually need judgment"], "a": [4], "e": "98パーセントを数秒で承認しているという事実は、精度の証拠ではなく、レビューが機能していない証拠です。人間の統制が形骸化しているとき、高い一致率は安心材料ではなく警告です。意図的に誤った案件を混ぜて検知率を測るのが確認手段になります。", "p": "高すぎる一致率は精度の証明ではなく、統制の形骸化のサイン。"}, {"d": "D2", "q": "A planning assistant holds conversations that regularly reach 300 turns. Users report that late in a conversation the assistant forgets decisions made earlier and contradicts itself. What should the architect do?", "o": ["Maintain a running structured summary of decisions and constraints and carry that forward instead of the raw transcript", "Increase max_tokens so the model can produce longer answers", "Move to a model with a larger context window and send the full transcript", "Instruct the model in the system prompt to remember everything that has been discussed", "Start a new conversation every 50 turns"], "a": [0], "e": "長い会話で失われるのは容量ではなく、重要な情報の顕在性です。決定事項と制約を構造化して持ち回れば、生の履歴を全部送るより確実で安価になります。Cは窓を広げても薄まった情報は薄いままで、コストだけが増えます。Eは文脈を捨てる対処です。", "p": "長い会話は履歴を全部送らず、決定事項を構造化して持ち回る。"}, {"d": "D2", "q": "A downstream service requires a strict JSON object from every model response. Today the team parses the response with a regular expression and about 4 percent of responses fail to parse. What should the architect do?", "o": ["Improve the regular expression to handle the observed variations", "Ask the model in the prompt to respond only with JSON and nothing else", "Retry the request whenever parsing fails", "Define the required shape as a tool schema so the model returns the object through a validated tool call, and validate it before use", "Have a second model call reformat the first response into JSON"], "a": [3], "e": "出力形式の保証をモデルの遵守や正規表現に頼るのが誤りです。ツールスキーマとして構造を定義すれば、形式は仕組みとして担保されます。Eはモデルをもう一段重ねるだけで、保証は増えずコストと遅延だけが増えます。", "p": "形式の保証はプロンプトではなくスキーマで。決定性は仕組み側に置く。"}, {"d": "D2", "q": "Select TWO. A team wants to cut cost on an agent that resends a large fixed instruction set on every request. Which two statements about prompt caching are correct?", "o": ["Cached content is billed at the same rate as uncached input", "The cache matches any repeated portion of the request regardless of where it appears", "Cache matching works on the prefix, so stable content must be placed before variable content", "A change to the tool definitions invalidates the cached prefix that follows them", "Cache entries persist until the model version changes"], "a": [2, 3], "e": "キャッシュは前方一致であり、順序が意味を持ちます。またツール定義はシステムプロンプトやメッセージより前に置かれるため、そこを変えると後続のキャッシュがまとめて無効化されます。Aは誤りでキャッシュ読み出しは大幅に安価、Eも誤りでTTLによって失効します。", "p": "キャッシュは前方一致。tools → system → messages の順で、前を変えると後ろが全部無効。"}, {"d": "D4", "q": "A RAG based policy assistant improved from 78 to 88 percent on the offline evaluation after a retrieval change. In production, user reported errors did not fall. What should the architect investigate first?", "o": ["The production model version differs from the one used offline", "Users are not reporting every error they encounter", "The offline evaluation set does not represent the distribution of real production queries", "The retrieval change helped only the easiest questions", "A ten point offline gain is within normal measurement noise"], "a": [2], "e": "オフラインで上がり、オンラインで動かない。この乖離の最頻の原因は、評価セットが本番の質問分布を代表していないことです。Dも起こり得ますが、それ自体が「評価セットが代表的でない」の一形態です。Eは10ポイントをノイズとするには大きすぎます。", "p": "オフラインとオンラインの乖離は、まず評価セットの代表性を疑う。"}, {"d": "D4", "q": "A payments company is ready to roll out a reworked dispute triage assistant. Offline evaluation shows a clear improvement over the current version. What should the architect require before full rollout?", "o": ["Sign off from the compliance team based on the offline results", "A staged rollout on a small share of live traffic with predefined online metrics and an automatic rollback threshold", "A one week soak in staging with synthetic traffic", "A rollout during a low volume period so that problems affect fewer users", "A second offline evaluation run to confirm the result is reproducible"], "a": [1], "e": "オフラインの改善は本番の改善を意味しません（前問と同じ理由）。実トラフィックの一部で、あらかじめ決めた指標としきい値で観測し、悪化したら自動で戻す。これが唯一、実データで検証しつつ被害を限定する方法です。Cは合成トラフィックで分布の問題を解決できません。", "p": "オフラインの改善は、段階的ロールアウトと自動ロールバックで実証する。"}, {"d": "D1", "q": "A platform team wants to automate first line investigation of production incidents. Investigation today requires reading dashboards, querying logs and correlating recent deploys. The team proposes an agent that diagnoses the incident and applies the fix. What should the architect propose?", "o": ["Build the full proposal, since diagnosis and remediation are both well defined", "Reject the idea, since incident response is too risky to automate", "Start with remediation only, since applying known fixes is mechanical", "Build a chatbot that answers questions about incidents when asked", "Start with investigation and hypothesis generation delivered to the on call engineer, and add remediation only for specific reversible actions once diagnosis quality has been measured"], "a": [4], "e": "調査（読み取りのみ、可逆）と修復（書き込み、しばしば不可逆）はリスクが桁違いです。価値の高い調査部分から始め、診断品質を実測してから、可逆な操作に限って修復を足すのが正しい分割です。Bは全否定の過剰反応、Cはリスクの高い方から始める逆順です。", "p": "読み取りと書き込みでリスクが違う。可逆な範囲から始め、実測してから広げる。"}, {"d": "D1", "q": "Select TWO. A customer service agent can issue goodwill refunds. Compliance initially required approval for every refund, which removed most of the time saving. Which two changes should the architect propose?", "o": ["Set a value threshold below which the agent may act autonomously, based on the actual distribution of refund amounts and the cost of an error", "Keep approval for every refund but make the approval interface faster", "Let the agent act autonomously and have compliance audit a sample afterwards, with no threshold", "Have the model estimate its own confidence and escalate when confidence is low", "Make every autonomous refund reversible within a defined window, and report exceptions to compliance on a schedule"], "a": [0, 4], "e": "「全件承認か、全件自動か」という二択を、金額のしきい値と可逆性で組み替えるのがこの問題の核心です。実際の金額分布と誤りのコストからしきい値を引き、自動実行分は一定期間取り消せるようにする。Dはモデルの自己申告した確信度に統制を委ねるもので、較正の保証がありません。", "p": "全件承認か全件自動かの二択を疑う。しきい値と可逆性で組み替える。"}], DOMS={"D1": "ソリューション設計", "D2": "モデル/プロンプト/コンテキスト", "D3": "統合とデプロイ", "D4": "評価・テスト・最適化", "D5": "ガバナンス/安全/リスク", "D6": "ステークホルダー/ライフサイクル", "D7": "開発者生産性"};
var KEY="ccarp_w30_v1", FSKEY="ccarp_fs30";
var ST={}; try{ ST=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ ST={}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} }
var K=1.15; try{var kk=parseFloat(localStorage.getItem(FSKEY)); if(kk)K=kk;}catch(e){}
document.documentElement.style.setProperty("--k",K);
function setK(d){K=Math.min(1.8,Math.max(.9,Math.round((K+d)*100)/100));
 document.documentElement.style.setProperty("--k",K);
 try{localStorage.setItem(FSKEY,K);}catch(e){}}

var filt="ALL", idx=[], ci=0, view="q";
function build(){ idx=[]; for(var i=0;i<Q.length;i++){
  if(filt==="ALL") idx.push(i);
  else if(filt==="NG"){ var s=ST[i]; if(s&&!s.ok) idx.push(i); }
  else if(Q[i].d===filt) idx.push(i); }
  if(idx.length===0) idx=[0];
  if(ci>=idx.length) ci=0; }
function multi(q){return q.a.length>1;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var LT="ABCDE";
function done(i){ return !!ST[i]; }
function nDone(){ var n=0; for(var i=0;i<Q.length;i++) if(ST[i]) n++; return n; }
function nOk(){ var n=0; for(var i=0;i<Q.length;i++) if(ST[i]&&ST[i].ok) n++; return n; }

function vQ(){
  var gi=idx[ci], q=Q[gi], s=ST[gi], sel=s?s.sel:(ST["_t"+gi]||[]);
  var d=nDone(), pct=Math.round(d/Q.length*100);
  var h='<div class="bar"><div class="in"><div class="pb"><i style="width:'+pct+'%"></i></div>'+
    '<span class="pos">'+d+'/'+Q.length+'</span>'+
    '<button class="btn g sm" onclick="view=\'menu\';R()">メニュー</button></div></div><div class="pad"></div>';
  h+='<div class="wrap"><span class="dm">'+q.d+' '+DOMS[q.d]+'</span>';
  if(multi(q)) h+='<span class="tag">SELECT '+q.a.length+'</span>';
  h+='<span class="tag" style="background:var(--pn2);border-color:var(--line);color:var(--mu);font-weight:600">#'+(gi+1)+'</span>';
  h+='<div class="stem">'+esc(q.q)+'</div>';
  for(var j=0;j<q.o.length;j++){
    var c="";
    if(s){ c=" dis"; if(q.a.indexOf(j)>=0) c+=" ok"; else if(sel.indexOf(j)>=0) c+=" ng"; }
    else if(sel.indexOf(j)>=0) c=" sel";
    h+='<div class="opt'+c+'"'+(s?'':' onclick="pick('+j+')"')+'>'+
       '<span class="L">'+LT[j]+'</span>'+esc(q.o[j])+'</div>';
  }
  if(!s && multi(q)) h+='<p class="sub">'+q.a.length+'つ選んでください（現在 '+sel.length+' つ）</p>';
  if(s){
    h+='<div class="vd '+(s.ok?"o":"x")+'">'+(s.ok?"○ 正解":"× 不正解")+'</div>';
    h+='<div class="exp">'+esc(q.e)+'<div class="pt">→ '+esc(q.p)+'</div></div>';
    h+='<button class="btn g sm" onclick="clr('+gi+')">この問題をやり直す</button>';
  }
  h+='</div>';
  h+='<div class="nav"><div class="in">'+
     '<button class="btn g sm" onclick="mv(-1)"'+(ci===0?" disabled":"")+'>← 前</button>'+
     '<span class="sp"></span><span class="pos">'+(ci+1)+' / '+idx.length+'</span><span class="sp"></span>'+
     '<button class="btn" onclick="mv(1)"'+(ci===idx.length-1?" disabled":"")+'>次 →</button>'+
     '</div></div>';
  document.getElementById("app").innerHTML=h;
}
function pick(j){
  var gi=idx[ci], q=Q[gi];
  var tmp=(ST["_t"+gi]||[]).slice(), k=tmp.indexOf(j);
  if(multi(q)){ if(k>=0) tmp.splice(k,1); else { if(tmp.length>=q.a.length) tmp.shift(); tmp.push(j); } }
  else tmp=[j];
  ST["_t"+gi]=tmp;
  if(tmp.length===q.a.length){
    var b=tmp.slice().sort(), c=q.a.slice().sort(), ok=true;
    for(var m=0;m<b.length;m++) if(b[m]!==c[m]) ok=false;
    ST[gi]={sel:tmp.slice(), ok:ok}; delete ST["_t"+gi];
  }
  save(); R();
}
function clr(gi){ delete ST[gi]; delete ST["_t"+gi]; save(); R(); }
function mv(d){ ci=Math.min(idx.length-1,Math.max(0,ci+d)); window.scrollTo(0,0); R(); }

function vMenu(){
  var d=nDone(), ok=nOk();
  var h='<div class="wrap"><h1>CCAR-P 弱点特化 30問</h1>'+
   '<p class="sub">2026-08-14 の分割模試 43/63（68%）の結果から、失点の集中していた領域だけを新規作成した問題集です。正解位置はA〜Eに均等に分散させてあります。</p>';
  h+='<div class="card"><div class="big">'+(d?Math.round(ok/d*100):0)+'%</div>'+
     '<p class="sub" style="margin:0">解答済 '+d+' / '+Q.length+' 問　正解 '+ok+' 問</p></div>';
  var by={};
  for(var i=0;i<Q.length;i++){ var dm=Q[i].d; by[dm]=by[dm]||[0,0,0];
    by[dm][2]++; if(ST[i]){ by[dm][1]++; if(ST[i].ok) by[dm][0]++; } }
  h+='<table><tr><th>ドメイン</th><th class="r">正解</th><th class="r">率</th></tr>';
  var ks=Object.keys(by).sort();
  for(var x=0;x<ks.length;x++){ var b=by[ks[x]];
    h+='<tr><td>'+ks[x]+' '+DOMS[ks[x]]+'</td><td class="r">'+b[0]+'/'+b[1]+' ('+b[2]+')</td>'+
       '<td class="r">'+(b[1]?Math.round(b[0]/b[1]*100)+'%':'-')+'</td></tr>'; }
  h+='</table>';
  h+='<h2>絞り込み</h2><div class="row">';
  var fs=[["ALL","全30問"],["D3","D3 統合 (15)"],["D6","D6 (4)"],["D5","D5 (4)"],
          ["D2","D2 (3)"],["D4","D4 (2)"],["D1","D1 (2)"],["NG","誤答のみ"]];
  for(var x=0;x<fs.length;x++)
    h+='<button class="btn g sm'+(filt===fs[x][0]?" on":"")+'" onclick="setF(\''+fs[x][0]+'\')">'+fs[x][1]+'</button>';
  h+='</div>';
  h+='<h2>一覧</h2><div class="grid">';
  for(var i=0;i<Q.length;i++){ var s=ST[i];
    h+='<div class="gc'+(s?(s.ok?" ok":" ng"):"")+'" onclick="jump('+i+')">'+(i+1)+'</div>'; }
  h+='</div>';
  h+='<div class="card"><div class="row"><span class="sub" style="margin:0">文字サイズ</span>'+
     '<span class="fs"><button onclick="setK(-0.1)">A-</button> <button onclick="setK(0.1)">A+</button></span>'+
     '<span class="sp"></span><button class="btn g sm" onclick="rst()">記録を消去</button></div></div>';
  h+='<div style="margin:16px 0 40px"><button class="btn" onclick="view=\'q\';R()">問題に戻る</button></div></div>';
