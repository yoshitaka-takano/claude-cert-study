function mmss(ms){ var t=Math.floor(ms/1000); var m=Math.floor(t/60), s=t%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s; }

function start(){
  S = { start: Date.now(), ans: {}, flag: {}, done: false, finished: 0 };
  cur = 0; save(); view="exam"; run();
}
function finish(auto){
  if(S.done) return;
  S.done = true; S.finished = Date.now(); S.auto = !!auto; save();
  if(tick){ clearInterval(tick); tick=null; }
  view="results"; render(); window.scrollTo(0,0);
}
function run(){
  if(tick) clearInterval(tick);
  tick = setInterval(function(){
    if(S.done){ clearInterval(tick); return; }
    if(left()<=0){ finish(true); return; }
    var c=document.getElementById("clk");
    if(c){ c.textContent=mmss(left());
      c.className="clock"+(left()<10*60000?" crit":(left()<30*60000?" warn":"")); }
  }, 1000);
  render();
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function nAns(){ var n=0; for(var k in S.ans){ if(S.ans[k] && S.ans[k].length) n++; } return n; }
function isCorrect(i){
  var sel=S.ans[i]||[], cor=Q[i].a;
  if(sel.length!==cor.length) return false;
  for(var j=0;j<sel.length;j++){ if(cor.indexOf(sel[j])<0) return false; }
  return true;
}

function render(){
  if(view==="start") return renderStart();
  if(view==="exam") return renderExam();
  if(view==="grid") return renderGrid();
  if(view==="results") return renderResults();
  if(view==="review") return renderReview();
}

function renderStart(){
  var prev = load();
  var h = '<div class="hero"><h1>CCAR-P 模擬試験</h1>'
    + '<div style="color:var(--tx2);font-size:calc(14px*var(--k))">63問 / 120分 / 本番同形式</div></div>';
  h += '<div class="lead"><b>本番と同じ条件で実施してください。</b><br><br>'
    + '・制限時間 <b>120分</b>。0になると自動提出されます<br>'
    + '・<b>採点は提出後</b>です。解答中に正誤は表示されません<br>'
    + '・<b>Select TWO</b> の問題は2つ選択してください<br>'
    + '・後で見直したい問題には<b>フラグ</b>を立てられます<br>'
    + '・「一覧」から任意の問題へ移動できます<br><br>'
    + '<b>腕時計は使わず、画面上のタイマーだけで管理</b>してください。'
    + 'メモは取らず、途中で調べないでください。本番の再現が目的です。<br><br>'
    + '目安は1問あたり<b>1分50秒</b>、30問終了時点で残り60分です。</div>';
  h += '<button class="cta" onclick="A.start()">試験を開始する</button>';
  if(prev && !prev.done) h += '<button class="sec" onclick="A.resume()">中断した試験を再開する</button>';
  if(prev && prev.done)  h += '<button class="sec" onclick="A.showPrev()">前回の結果を見る</button>';
  app.innerHTML = h;
}

function renderExam(){
  var q = Q[cur], multi = q.a.length>1, sel = S.ans[cur]||[];
  var h = '<div class="hdr"><div class="clock" id="clk">'+mmss(left())+'</div>'
    + '<div class="mid"><b>'+(cur+1)+' / '+TOTAL+'</b>解答済み '+nAns()+'</div>'
    + '<button class="hbtn'+(S.flag[cur]?" on":"")+'" onclick="A.flag()">'+(S.flag[cur]?"★":"☆")+' フラグ</button>'
    + '<button class="hbtn" onclick="A.grid()">一覧</button></div>';
  h += '<div class="pb"><i style="width:'+((cur+1)/TOTAL*100)+'%"></i></div>';
  h += '<span class="dchip">'+q.d+' &middot; '+DOM[q.d]+'</span>'
     + (multi?'<span class="tw">SELECT TWO</span>':'');
  h += '<div class="stem">'+esc(q.q)+'</div>';
  for(var k=0;k<q.o.length;k++){
    h += '<button class="opt'+(sel.indexOf(k)>=0?" sel":"")+'" onclick="A.pick('+k+')">'
       + '<span class="k">'+LTR[k]+'</span><span>'+esc(q.o[k])+'</span></button>';
  }
  h += '<div class="nav">'
     + '<button class="p" onclick="A.go('+(cur-1)+')"'+(cur===0?' disabled style="opacity:.35"':'')+'>← 前へ</button>'
     + (cur<TOTAL-1
        ? '<button class="n" onclick="A.go('+(cur+1)+')">次へ →</button>'
        : '<button class="n" onclick="A.grid()">一覧で確認して提出</button>')
     + '</div>';
  app.innerHTML = h;
}

function renderGrid(){
  var h = '<div class="hdr"><div class="clock" id="clk">'+mmss(left())+'</div>'
    + '<div class="mid"><b>解答一覧</b>解答済み '+nAns()+' / '+TOTAL+'</div>'
    + '<button class="hbtn" onclick="A.back()">戻る</button></div>';
  h += '<div class="grid">';
  for(var i=0;i<TOTAL;i++){
    var cls="cell"+((S.ans[i]&&S.ans[i].length)?" done":"")+(S.flag[i]?" flag":"")+(i===cur?" cur":"");
    h += '<button class="'+cls+'" onclick="A.go('+i+')">'+(i+1)+'</button>';
  }
  h += '</div>';
  var unans = TOTAL-nAns(), fl=0; for(var k in S.flag){ if(S.flag[k]) fl++; }
  h += '<div class="note"><b>未解答 '+unans+' 問</b>、フラグ '+fl+' 問。'
     + (unans>0?'未解答は不正解として集計されます。':'すべて解答済みです。')+'</div>';
  h += '<button class="cta" onclick="A.confirmSubmit()">提出して採点する</button>';
  h += '<button class="sec" onclick="A.back()">解答に戻る</button>';
  app.innerHTML = h;
}

function renderResults(){
  var ok=0, by={}, i;
  ORD.forEach(function(d){ by[d]={n:0,ok:0}; });
  for(i=0;i<TOTAL;i++){
    var d=Q[i].d; if(!by[d]) by[d]={n:0,ok:0};
    by[d].n++; if(isCorrect(i)){ ok++; by[d].ok++; }
  }
  var pct = Math.round(ok/TOTAL*1000)/10;
  var used = Math.min(LIMIT, (S.finished||Date.now()) - S.start);
  var vc = pct>=78?"g":(pct>=65?"w":"r");
  var vt = pct>=78?"本番でも通用する水準":(pct>=65?"合格ラインの手前":"土台の再構築が必要");
  var h = '<div class="hdr"><div class="mid" style="flex:1"><b>模擬試験の結果</b>'
    + '所要 '+mmss(used)+(S.auto?"（時間切れ自動提出）":"")+'</div></div>';
  h += '<div class="res"><div class="big">'+pct+'<span style="font-size:calc(24px*var(--k));color:var(--tx2)">%</span></div>'
     + '<div class="sub">'+ok+' / '+TOTAL+' 問正解</div>'
     + '<div class="verdict '+vc+'">'+vt+'</div></div>';
  h += '<div class="note">本番の合格ラインは1000点満点で720点ですが、素点との換算方法は非公開です。'
     + 'ここでの正答率はあくまで自主基準として、<b>78%以上を安全圏</b>の目安にしてください。</div>';
  h += '<h2>ドメイン別</h2><table>';
  ORD.forEach(function(d){
    var b=by[d]; if(!b||!b.n) return;
    var p=Math.round(b.ok/b.n*100);
    var cl=p>=80?"hi":(p>=60?"mid":"lo");
    h += '<tr><td><b>'+d+'</b> <span style="color:var(--tx3)">'+DOM[d]+'</span></td>'
       + '<td style="width:32%"><div class="mini"><i style="width:'+(b.ok/b.n*100)+'%;background:var(--ok)"></i>'
       + '<i style="width:'+((b.n-b.ok)/b.n*100)+'%;background:var(--bad)"></i></div></td>'
       + '<td class="'+cl+'">'+p+'% <span style="color:var(--tx3);font-weight:400">('+b.ok+'/'+b.n+')</span></td></tr>';
  });
  h += '</table>';
  h += '<button class="cta" onclick="A.review(0)">全問の解説を見る</button>';
  h += '<button class="sec" onclick="A.reviewWrong()">誤答だけを見直す</button>';
  h += '<button class="sec" onclick="A.reset()">記録を消してやり直す</button>';
  app.innerHTML = h;
}

function renderReview(){
  var q=Q[cur], sel=S.ans[cur]||[], multi=q.a.length>1, correct=isCorrect(cur);
  var h = '<div class="hdr"><div class="mid" style="flex:1"><b>解説 '+(cur+1)+' / '+TOTAL+'</b>'
    + (correct?'正解':'誤答')+'</div>'
    + '<button class="hbtn" onclick="A.grid2()">一覧</button>'
    + '<button class="hbtn" onclick="A.toResults()">結果へ</button></div>';
  h += '<span class="dchip">'+q.d+' &middot; '+DOM[q.d]+'</span>'+(multi?'<span class="tw">SELECT TWO</span>':'');
  h += '<div class="stem">'+esc(q.q)+'</div>';
  for(var k=0;k<q.o.length;k++){
    var cls="opt";
    if(q.a.indexOf(k)>=0) cls+=" right";
    else if(sel.indexOf(k)>=0) cls+=" wrong";
    h += '<div class="'+cls+'"><span class="k">'+LTR[k]+'</span><span>'+esc(q.o[k])+'</span></div>';
  }
  var yours = sel.length? sel.map(function(x){return LTR[x];}).join(" と ") : "未解答";
  var ans = q.a.map(function(x){return LTR[x];}).join(" と ");
  h += '<div class="exp"><span class="k2">正解：'+ans+'　／　あなたの解答：'+yours+'</span>'
     + esc(q.e)+'<div class="lb">本番で狙われるポイント</div>'+esc(q.p)+'</div>';
  h += '<div class="nav">'
     + '<button class="p" onclick="A.review('+(cur-1)+')"'+(cur===0?' disabled style="opacity:.35"':'')+'>← 前へ</button>'
     + (cur<TOTAL-1?'<button class="n" onclick="A.review('+(cur+1)+')">次へ →</button>'
                   :'<button class="n" onclick="A.toResults()">結果に戻る</button>')+'</div>';
  app.innerHTML = h; window.scrollTo(0,0);
}

function grid2(){
  var h = '<div class="hdr"><div class="mid" style="flex:1"><b>解説の一覧</b>緑が正解、赤が誤答</div>'
    + '<button class="hbtn" onclick="A.toResults()">結果へ</button></div><div class="grid">';
  for(var i=0;i<TOTAL;i++){
    h += '<button class="cell '+(isCorrect(i)?"g":"r")+'" onclick="A.review('+i+')">'+(i+1)+'</button>';
  }
  h += '</div>'; app.innerHTML=h;
}

window.A = {
  start:function(){ if(load() && !confirm("既存の記録を消して新しく開始します。よろしいですか？")) return; clearS(); start(); },
  resume:function(){ S=load(); if(!S) return; if(left()<=0){ finish(true); return; } cur=0; view="exam"; run(); },
  showPrev:function(){ S=load(); view="results"; render(); },
  pick:function(k){
    var q=Q[cur], sel=(S.ans[cur]||[]).slice(), p=sel.indexOf(k);
    if(q.a.length>1){ if(p>=0) sel.splice(p,1); else if(sel.length<2) sel.push(k); }
    else sel = (p>=0)? [] : [k];
    S.ans[cur]=sel; save(); renderExam();
  },
  flag:function(){ S.flag[cur]=!S.flag[cur]; save(); renderExam(); },
  go:function(i){ if(i<0||i>=TOTAL) return; cur=i; view="exam"; renderExam(); window.scrollTo(0,0); },
  grid:function(){ view="grid"; renderGrid(); window.scrollTo(0,0); },
  back:function(){ view="exam"; renderExam(); },
  confirmSubmit:function(){
    var u=TOTAL-nAns();
    var m = u>0 ? ("未解答が "+u+" 問あります。提出すると採点され、以降は解答できません。よろしいですか？")
                : "提出して採点します。よろしいですか？";
    if(confirm(m)) finish(false);
  },
  review:function(i){ if(i<0||i>=TOTAL) return; cur=i; view="review"; renderReview(); },
  reviewWrong:function(){ for(var i=0;i<TOTAL;i++){ if(!isCorrect(i)){ A.review(i); return; } } alert("全問正解です。"); },
  grid2:function(){ grid2(); },
  toResults:function(){ view="results"; render(); window.scrollTo(0,0); },
  reset:function(){ if(!confirm("記録を消去して最初からやり直します。よろしいですか？")) return; clearS(); S=null; view="start"; render(); }
};

(function(){
  var prev=load();
  if(prev && !prev.done && (prev.start + LIMIT - Date.now())>0){ S=prev; }
  view="start"; render();
})();
</script></body></html>
