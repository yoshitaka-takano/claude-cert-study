<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>CCAR-P 模擬試験 63問 / 120分</title>
<style>
:root{--k:1.1;--bg:#0e1116;--panel:#161b22;--panel2:#1c232c;--line:#2a323d;--tx:#e6edf3;
--tx2:#9aa7b4;--tx3:#6e7d8d;--ac:#c96442;--ac2:#e08a6b;--ok:#3fb950;--bad:#f85149;--warn:#d29922}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin:0 auto;padding:0 15px 90px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hdr{position:sticky;top:0;z-index:20;background:rgba(14,17,22,.96);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);padding:11px 0;margin-bottom:16px;
display:flex;align-items:center;gap:12px}
.clock{font-size:calc(21px*var(--k));font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock.warn{color:var(--warn)} .clock.crit{color:var(--bad)}
.hdr .mid{flex:1;font-size:calc(12px*var(--k));color:var(--tx3)}
.hdr .mid b{display:block;color:var(--tx);font-size:calc(14px*var(--k))}
.hbtn{font-size:calc(12.5px*var(--k));font-weight:700;color:var(--tx2);border:1px solid var(--line);
background:var(--panel);border-radius:9px;padding:8px 12px}
.hbtn.on{background:var(--warn);border-color:var(--warn);color:#241e0d}
.hbtn.sub{background:var(--ac);border-color:var(--ac);color:#fff}
.pb{height:3px;background:#232b35;border-radius:2px;overflow:hidden;margin-bottom:16px}
.pb i{display:block;height:100%;background:var(--ac);transition:width .2s}
.dchip{display:inline-block;font-size:calc(10.5px*var(--k));padding:3px 10px;border-radius:20px;
background:var(--panel2);border:1px solid var(--line);color:var(--tx2)}
.tw{font-size:calc(10.5px*var(--k));font-weight:800;color:var(--warn);letter-spacing:.06em;margin-left:8px}
.stem{background:var(--panel);border:1px solid var(--line);border-radius:12px;
padding:17px;margin:11px 0 14px;font-size:calc(15px*var(--k));line-height:1.6}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px;border-radius:11px;
background:var(--panel);border:1px solid var(--line);margin-bottom:9px;text-align:left;
font-size:calc(14.5px*var(--k));line-height:1.55}
.opt .k{flex:none;width:calc(25px*var(--k));height:calc(25px*var(--k));border-radius:50%;
border:1.5px solid var(--tx3);display:flex;align-items:center;justify-content:center;
font-size:calc(12px*var(--k));font-weight:800;color:var(--tx3);margin-top:1px}
.opt.sel{border-color:var(--ac);background:#241812}
.opt.sel .k{border-color:var(--ac);background:var(--ac);color:#fff}
.opt.right{border-color:var(--ok);background:#0f2213}
.opt.right .k{border-color:var(--ok);background:var(--ok);color:#06210c}
.opt.wrong{border-color:var(--bad);background:#25100f}
.opt.wrong .k{border-color:var(--bad);background:var(--bad);color:#fff}
.nav{display:flex;gap:10px;margin-top:18px}
.nav button{flex:1;padding:15px;border-radius:11px;font-size:calc(14.5px*var(--k));font-weight:700}
.nav .p{background:var(--panel);border:1px solid var(--line);color:var(--tx2);flex:0 0 32%}
.nav .n{background:var(--ac);color:#fff}
.hero{text-align:center;padding:34px 0 8px}
h1{font-size:calc(25px*var(--k));margin:8px 0 6px;letter-spacing:-.01em}
.lead{font-size:calc(14px*var(--k));color:var(--tx2);line-height:1.85;text-align:left;
background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;margin:18px 0}
.lead b{color:var(--tx)}
.cta{display:block;width:100%;padding:17px;border-radius:12px;background:var(--ac);color:#fff;
font-weight:800;font-size:calc(16px*var(--k));text-align:center;margin-bottom:10px}
.sec{display:block;width:100%;padding:14px;border-radius:11px;background:var(--panel);
border:1px solid var(--line);color:var(--tx2);font-size:calc(13.5px*var(--k));text-align:center;margin-bottom:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin:14px 0 20px}
.cell{padding:11px 0;border-radius:9px;background:var(--panel);border:1px solid var(--line);
color:var(--tx3);font-size:calc(13px*var(--k));font-weight:700;text-align:center;position:relative}
.cell.done{border-color:#2c4a6b;color:#8ec1f0;background:#132131}
.cell.flag{border-color:var(--warn);color:#e5c15c;background:#241e0d}
.cell.cur{outline:2px solid var(--ac);outline-offset:1px}
.cell.g{border-color:#20502c;color:#7ee08e;background:#12240f}
.cell.r{border-color:#5c2226;color:#f0777a;background:#25100f}
.res{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center;margin-bottom:12px}
.res .big{font-size:calc(50px*var(--k));font-weight:800;letter-spacing:-.03em;line-height:1.05}
.res .sub{font-size:calc(13.5px*var(--k));color:var(--tx2);margin-top:6px}
.verdict{display:inline-block;margin-top:12px;padding:7px 16px;border-radius:20px;
font-size:calc(13px*var(--k));font-weight:800}
.verdict.g{background:#12240f;border:1px solid #20502c;color:#7ee08e}
.verdict.w{background:#241e0d;border:1px solid #5c4a15;color:#e5c15c}
.verdict.r{background:#25100f;border:1px solid #5c2226;color:#f0777a}
table{width:100%;border-collapse:collapse;font-size:calc(13.5px*var(--k));margin:6px 0 18px}
td{padding:11px 4px;border-bottom:1px solid #212832;vertical-align:middle}
td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.mini{height:6px;background:#232b35;border-radius:3px;overflow:hidden;display:flex}
.mini i{display:block;height:100%}
.hi{color:var(--ok)}.mid{color:var(--warn)}.lo{color:var(--bad)}
.exp{background:#101a24;border:1px solid #24384d;border-radius:12px;padding:16px;margin-top:13px;
font-size:calc(13.5px*var(--k));line-height:1.8}
.exp .k2{font-weight:800;color:#7ee08e;font-size:calc(14.5px*var(--k));display:block;margin-bottom:8px}
.exp .lb{font-size:calc(10.5px*var(--k));letter-spacing:.07em;color:var(--tx3);text-transform:uppercase;
margin:13px 0 3px;font-weight:800}
.note{background:#1a1512;border:1px solid #4a3020;border-left:3px solid var(--warn);border-radius:11px;
padding:14px 16px;font-size:calc(13px*var(--k));line-height:1.75;margin:14px 0}
h2{font-size:calc(16px*var(--k));margin:26px 0 8px;padding-left:10px;border-left:3px solid var(--ac)}
</style></head><body><div class="wrap">
<div id="app"></div></div>
<script>
var Q = [{"d": "D3", "q": "A customer support web app streams Claude responses token by token. After three tool calls were added to the agent loop, users report the UI appears frozen for 6 to 12 seconds before any text appears, and agents assume the system crashed and reload the page. The underlying tool latency cannot be reduced this quarter. What should the architect do first?", "o": ["Emit structured progress events for each tool invocation over the same stream so the UI can render step level status while tools are running", "Disable streaming and return the complete response once all tools finish, showing a spinner for the whole duration", "Increase the client HTTP timeout and add a retry so the request is not dropped during the silent period", "Move the tool calls into a background job and have the UI poll a results endpoint every 5 seconds", "Instruct the model to emit a short preamble sentence before calling any tool so that some text appears immediately"], "a": [0], "e": "問題はトークン生成の遅さではなく、ツール実行中にストリームへ何も流れないことによる無反応状態です。同じストリーム上にツール開始や完了などの構造化イベントを流し、UIが進行状況を描画できるようにすれば、ツール遅延を短縮しなくても体感の停止は解消します。最も紛らわしいのはモデルに前置きの一文を書かせる案で、実際に一部のエージェント設計で使われますが、モデルの振る舞いは保証されず、前置きの後に依然として数秒の沈黙が残ります。", "p": "体感遅延の問題は、処理の高速化ではなく進行状況の可視化で解く。"}, {"d": "D1", "q": "A sales VP asks for an AI assistant that will make the sales team more productive. There is no defined scope, target metric or budget. The delivery team is ready to start building a chat interface over the CRM next sprint. What should the architect do first?", "o": ["Identify a small number of concrete, high frequency tasks in the current workflow, quantify their volume and current cost, and agree a success metric before choosing an architecture", "Build a thin chat over CRM prototype within two weeks so that the VP has something concrete to react to", "Run a workshop that collects and prioritizes every AI idea the sales team can think of", "Benchmark three vendor sales assistant products and present a comparison to the sponsor", "Fix the technical architecture first so the team is not blocked, and refine the scope as requirements emerge"], "a": [0], "e": "測定対象が定義されていない状態でアーキテクチャを決めると、成功も失敗も判定できず、後から要件が変わるたびに作り直しになります。既存業務の中で頻度と単価が明確なタスクを特定し、現状値と目標値を合意することが、単一エージェントか決定論的ワークフローかといった判断の前提になります。最も紛らわしいのは二週間でプロトタイプを作る案で、実際に有効な手段ではありますが、何を良しとするかの合意がないまま作ると、デモの印象だけで評価が動きます。", "p": "曖昧な要望はまず対象タスクと成功指標の定量化に還元する。"}, {"d": "D4", "q": "A retail bank scores its support assistant with an LLM judge on a 1 to 5 rubric. The judge runs on every release and the team compares average scores release over release. A new reviewer asks how the team knows the judge is actually measuring what the rubric describes. What should the architect do first?", "o": ["Have the judge score each output three times and average the results to reduce variance", "Build a calibration set labeled by trained human reviewers, measure judge to human agreement per rubric criterion, and rewrite the criteria where agreement is low", "Replace the 1 to 5 scale with a 1 to 10 scale so the judge can express finer distinctions", "Switch the judge to a larger model from a different vendor and compare the resulting scores", "Add few shot examples of good and bad answers to the judge prompt"], "a": [1], "e": "判定器の妥当性は、スコアの安定性ではなく人間ラベルとの一致で示す必要がある。校正セットを作り、ルーブリックの基準ごとに一致率を測れば、どの基準が曖昧で書き直しが必要かが特定できる。最も紛らわしいのは3回採点して平均する案だが、これは同じ系統的な偏りを繰り返し平均するだけで、分散は下がっても妥当性は上がらない。", "p": "判定器は絶対スコアではなく人間ラベルとの一致度で検証する。"}, {"d": "D5", "q": "An internal IT support agent answers from a wiki that any employee can edit, and it can reset passwords, open tickets and post to team channels. A red team planted a wiki page instructing the agent to post the contents of the last ticket to a public channel, and the agent complied. What should the architect do first?", "o": ["Add a system prompt rule stating that retrieved wiki content is reference material and must never be treated as instructions", "Run every retrieved passage through an injection detection classifier and drop flagged passages", "Restrict which destinations the posting tool can reach and require the backend to authorize any action against the requesting user identity and scope, so retrieved text cannot expand what the agent may do", "Lock wiki editing to a reviewed set of authors so untrusted content cannot enter the corpus", "Require the agent to cite the wiki page behind every action so reviewers can trace where an instruction originated"], "a": [2], "e": "取得したウィキ本文は信頼できない入力であり、プロンプト上の注意書きや検出器はいずれも確率的な緩和にすぎない。根本対策は、投稿ツールが到達できる宛先を限定し、要求者本人の権限に照らしてバックエンドが認可することで、本文がどう指示しても実行可能な行為の範囲が広がらない構造にすることである。指示階層をプロンプトで宣言する案は遵守がモデルの確率的挙動に依存する。", "p": "注入対策は文面のフィルタではなく権限境界の設計で行う。"}, {"d": "D6", "q": "A six month deployment of a Claude based contract summarization service is in its second month. The executive sponsor asks for a weekly slide showing total requests served, currently 4,200 per week, as the measure of value. The architect knows the legal team still re-reads every summary before use, so requests served says nothing about benefit. What should the architect propose?", "o": ["Keep the request count slide the sponsor asked for and add a satisfaction survey question each month", "Replace the request count with a measured comparison: minutes per contract before the tool, currently 38 minutes on a sample of 60 contracts, against minutes per contract after, reported with the re-read step included", "Report weekly token spend against budget so the sponsor can see cost control", "Wait until the re-read step is removed, then begin value reporting so the numbers are not diluted", "Report the summarization quality score from the internal evaluation set each week"], "a": [1], "e": "リクエスト数は活動量の指標であり、価値の指標ではない。現状は要約後に法務が全件を読み直しているため、件数が増えても業務時間は減っていない可能性がある。正しい対応は前提を組み替え、導入前ベースライン（60件で1件38分）と導入後の実測を、読み直し工程を含めた形で比較することである。満足度調査を足す案は、ベースラインのない件数指標の弱点を補えない。", "p": "活動量指標を要求されたら、ベースライン付きの成果指標に置き換える。"}, {"d": "D2", "q": "A support assistant sends a 30,000 token policy manual, a 1,200 token system prompt, and a 400 token customer profile on every request. The team enabled prompt caching, but the cache read rate sits at 4 percent and cost is unchanged. Inspection shows the request is assembled as customer profile, then system prompt, then policy manual, then the conversation. Traffic is steady at about 12 requests per minute. What should the architect change first?", "o": ["Move the customer profile after the system prompt and the policy manual so the stable content forms the prefix, and set the cache breakpoint at the end of the manual", "Increase the cache lifetime setting so entries survive between customers", "Trim the policy manual to the 8,000 most relevant tokens so more requests fit within the cache", "Batch requests from the same customer so they reuse each other's cache entries", "Move the conversation history above the policy manual so the newest content sits closest to the question"], "a": [0], "e": "プロンプトキャッシュは先頭からの完全一致プレフィックスに対して効く。顧客プロファイルが先頭にあると、リクエストごとに1トークン目から不一致となり、後続の3万トークンのマニュアルは一度もヒットしない。安定部分を前に、可変部分を後ろに並べ替えるだけでヒット率は劇的に改善する。毎分12リクエストの安定トラフィックでは寿命は制約になっていない。", "p": "キャッシュは安定部分を前、可変部分を後ろに並べたときだけ効く。"}, {"d": "D7", "q": "A 60 engineer platform organization keeps a single CLAUDE.md of about 1,300 lines at the repository root, grown over nine months. Engineers report that generated changes still violate the conventions it describes, and most admit they have never read past the first screen. What should the architect recommend?", "o": ["Cut the root file down to the rules that cannot be checked automatically, move the checkable rules into linters and CI so that violations fail the build, and place directory level files next to the code they govern", "Reorganize the 1,300 lines with a table of contents and clear headings, and require engineers to read it during onboarding", "Split the file into one file per team and let each team own its own copy", "Move the conventions into a shared skill that engineers invoke when they need it", "Keep the file as it is and add a pre commit hook that prints a reminder to follow the conventions"], "a": [0], "e": "1,300行の規約ファイルは、人にもモデルにも実効性を持たない。機械判定できる規約はCIとリンタに移して強制し、判断が要る規約だけを短い文書に残し、スコープの限られた規約は対象コードの近くに置くのが構造的な解決である。読まれない原因は構造ではなく分量と強制力の欠如である。", "p": "プロジェクト規約は、機械強制できるものをCIへ移し、文書は判断が要る分だけ残す。"}, {"d": "D3", "q": "An operations team must classify 2.4 million historical support tickets into 40 categories. The current script calls the Messages API synchronously in a loop, would take 11 days, and frequently hits rate limits. Results are needed within 72 hours and no interactive user is waiting. What should the architect recommend?", "o": ["Submit the work through the batch processing API in partitioned jobs, with a shared cached system prompt and a durable record of per item results", "Keep the synchronous loop but raise concurrency with a large thread pool and request a quota increase", "Keep the synchronous loop and switch to the smallest available model to increase throughput", "Distribute the load across several additional API keys and accounts to multiply the effective rate limit", "Fine tune a dedicated classifier first so that each request becomes cheaper and faster"], "a": [0], "e": "対話的な利用者が存在せず、遅延許容度が高い大量オフライン処理は、バッチ処理APIの典型的な適用対象であり、スループットとコストの両面で有利です。共通のシステムプロンプトをキャッシュし、ジョブを分割して結果を永続化すれば、途中失敗からの再開も容易になります。最も紛らわしいのは並列度を上げて上限緩和を申請する案で、短期的には動きますが、対話系トラフィックを圧迫し、レート制限との綱引きを運用で抱え続けることになります。", "p": "利用者が待っていない大量処理は同期ループではなくバッチ経路に載せる。"}, {"d": "D1", "q": "A billing team wants an LLM to compute prorated refunds from contract terms and usage data. The rules are documented in a 30 page policy, are fully deterministic, and are audited annually by an external auditor. Early tests show 93 percent numeric accuracy. What should the architect recommend?", "o": ["Implement the proration rules as deterministic code and use the model only to extract contract parameters into a validated schema, routing low confidence extractions to a reviewer", "Improve accuracy by giving the model a calculator tool and step by step prompting until it reaches 99 percent", "Have a second model independently verify each calculation and escalate the cases where the two disagree", "Fine tune the model on 20 thousand historical refund cases to lift numeric accuracy", "Keep the LLM calculation and add a human reviewer for every refund above a monetary threshold"], "a": [0], "e": "規則が決定論的で外部監査の対象である以上、計算部分は再現性と説明可能性が要求され、確率的な生成に任せるべき領域ではありません。契約書という非構造テキストからパラメータを取り出す部分だけをモデルに担わせ、計算はコードで実行すれば、監査証跡も安定します。最も紛らわしいのは電卓ツールと段階的推論で精度を上げる案で、数値は改善しますが、同じ入力に同じ出力が保証されない点が残ります。", "p": "決定論的で監査対象の計算はLLMではなくコードに置き、抽出だけを任せる。"}, {"d": "D4", "q": "A logistics company is building an evaluation set for an assistant that answers shipment questions. The product owner insists the set must mirror production traffic exactly, since 82 percent of real questions are simple tracking lookups. The rare cases that drive escalations, customs holds and damaged goods claims, would then be about 2 percent of the set. What should the architect do?", "o": ["Follow the production distribution so the aggregate score reflects the real user experience", "Follow the production distribution but grow the set to 5000 cases so rare categories still have enough examples", "Build a stratified set that over samples high impact categories, and report per category scores alongside a traffic weighted aggregate", "Split into two sets: a production mirrored set used for release gates and a rare case set used only for research", "Keep the production distribution and rely on production monitoring to catch rare case failures"], "a": [2], "e": "本番分布をそのまま写すと、集約スコアは容易な照会に支配され、通関保留や破損クレームのような高影響カテゴリの劣化が希釈されて見えなくなる。層化して高影響カテゴリを厚くサンプルし、カテゴリ別スコアとトラフィック加重の集約値を併記すれば、体感品質とリスクの双方を同時に監視できる。総数を5000件に増やす案は希少カテゴリの件数が確保できても、ゲートに使う集約値は依然として簡単な照会に支配される。", "p": "評価セットは母集団の再現ではなくリスク加重の層化で設計する。"}, {"d": "D5", "q": "A German subsidiary must keep customer support data in the EU. The vendor contract includes a data processing addendum, and the procurement lead considers residency satisfied. The architecture routes requests to the nearest available region and ships full prompts to a central observability stack in the US for debugging. What should the architect do?", "o": ["Accept the addendum as the control and add a runbook note telling engineers not to export logs", "Pin inference to EU endpoints, configure zero data retention with the provider, keep prompt and completion logs in an EU store with retention limits, and add an automated check that fails deployment when a non EU endpoint or log sink is configured", "Redact personal data from prompts before they leave the EU so the US observability stack only receives sanitized text", "Encrypt the observability logs at rest in the US using keys held in the EU", "Move the whole workload to a self hosted open model in an EU data center"], "a": [1], "e": "DPAは契約上の約束であり、実際の推論経路やログの保管先を規定するものではない。EUエンドポイントへの固定、プロバイダ側のゼロデータ保持設定、EU内でのログ保管と保持期間、そして非EUのエンドポイントやログシンクが設定されたらデプロイを失敗させる自動チェックまで揃って、初めて技術的に担保されたと言える。マスキングして米国へ送る案は、移転そのものが論点になる場合に要件を満たさない。", "p": "データ所在は契約書ではなく経路と保管と自動検証の構成で担保する。"}, {"d": "D6", "q": "A VP of Legal opens a project with: We want Claude to review our NDAs. The organization receives about 900 NDAs per quarter and has three paralegals. What should the architect investigate first?", "o": ["Which clause types the paralegals currently flag, what happens after a clause is flagged, and who signs off on an NDA once it is flagged", "Whether the NDA corpus can be exported into the environment where the model will run", "Which model tier gives the best clause extraction accuracy on a sample of 50 NDAs", "Whether the volume of 900 per quarter justifies the licensing cost", "What the current average turnaround time per NDA is"], "a": [0], "e": "レビューという言葉は作業内容を特定しない。まず既存の判断基準（どの条項を、なぜフラグするか）と、フラグ後の意思決定者・承認フローを把握しなければ、出力形式も成功条件も定義できない。ターンアラウンドタイムの確認は改善対象を測る指標であって、何を自動化するかを決める情報にはならない。", "p": "曖昧な要望はまず既存の判断基準と下流の意思決定者から分解する。"}, {"d": "D2", "q": "An extraction service returns a JSON object defined by a 46 field schema. Downstream systems read only 9 of those fields. Reviewers report that free text fields such as risk_notes are frequently wrong, and that enum fields sometimes contain values outside the allowed list. What should the architect recommend?", "o": ["Reduce the schema to the 9 fields actually consumed, declare the allowed values for each enum explicitly in the schema, and validate every response against the schema with a bounded retry on failure", "Keep the 46 field schema for future needs and add post processing that maps out of range enum values to the nearest allowed value", "Raise the model tier so the larger model adheres to the schema more reliably", "Add three few shot examples showing a fully populated 46 field object", "Request the output as YAML, which models format more reliably than JSON"], "a": [0], "e": "消費されない37フィールドは、出力トークンと誤りの表面積を増やすだけで、誰も検証していないため品質も担保されない。スキーマを実消費分に絞り、列挙値を明示し、機械検証と限定リトライを入れることが正攻法である。範囲外の値を近い値に丸める案は、誤った値を正しい値に見せかけ、下流の誤判断を隠蔽する。", "p": "構造化出力は、実際に消費されるフィールドだけに絞り機械検証をかける。"}, {"d": "D7", "q": "Nine teams have adopted Claude Code. A survey finds 34 custom slash commands across the teams, of which 11 perform essentially the same release note generation with slightly different output formats. Two of those 11 embed a deployment step that was retired four months ago. What should the architect propose?", "o": ["Publish a small reviewed set of shared commands as a versioned distributed package with a named owner and a deprecation path, and let teams keep local commands only for genuinely team specific work", "Ban team level commands and route all command creation through the platform team", "Create a shared directory where any team can add commands and rely on peer code review", "Leave the duplication in place, since each format reflects a real local difference, and fix only the outdated deployment step", "Document all 34 commands on a wiki page so that teams can check what exists before writing a new one"], "a": [0], "e": "問題は重複そのものより、所有者もバージョンも更新経路もない共有資産が陳腐化していることである。少数の中核コマンドを版管理付きで配布し、実名の所有者と廃止手順を定めれば、退役した手順の修正が全チームに伝播する。全コマンドを一元管理する案は、正当な局所差異まで滞留させ管理外のコピーを生む。", "p": "共有コマンドは、所有者とバージョンと廃止経路を持つ配布物として扱う。"}, {"d": "D3", "q": "Select TWO. A production agent answering policy questions gives wrong answers in roughly 4 percent of sessions, but the team can only see the final text response in their logs. They cannot tell whether retrieval, tool selection, or final generation is at fault. Which TWO instrumentation changes give the most diagnostic value first?", "o": ["Record, per request, the retrieved chunk identifiers and their relevance scores, linked to a trace identifier", "Record each tool call name, its input arguments and a truncated result, linked to the same trace identifier", "Increase log retention from 7 days to 90 days so more failures are available for analysis", "Add a second model that scores the helpfulness of every response in real time", "Log the full raw request and response bodies including the entire prompt for every call"], "a": [0, 1], "e": "原因の切り分けには、検索結果とツール呼び出しという二つの中間ステップを、同一トレースIDで結び付けて記録することが最短の手段です。どのチャンクが何位で入ったか、どのツールにどの引数が渡ったかが見えれば、検索失敗、ツール選択誤り、生成誤りのいずれかに切り分けられます。全リクエストの生ログ全文を保存する案は一見網羅的ですが、機微情報の保全コストが跳ね上がる割に、構造化されていないため切り分けの効率は上がりません。", "p": "エージェントの障害分析は最終出力ではなく中間ステップの構造化計測から始める。"}, {"d": "D1", "q": "A legal team approves an agent that drafts clause level redlines for NDAs. The proposed control is that a lawyer reviews every final redlined document before it goes to the counterparty. Volume is 400 NDAs per month, and the lawyers say full review will consume the entire time saving. What should the architect propose?", "o": ["Tier the work by risk: auto apply changes that exactly match pre approved fallback clause language, and route only deviations and unmatched clauses to a lawyer", "Keep full review but shorten it by having the agent produce a summary of the changes it made", "Sample 10 percent of documents for lawyer review and send the remaining 90 percent unreviewed", "Have a second agent critique the first agent's redlines and forward only the disputed ones to a lawyer", "Restrict the agent to leaving suggested comments rather than edits, so that a lawyer still writes every change"], "a": [0], "e": "全件レビューという前提は、統制目的を満たす唯一の形ではなく、リスクが均一であるという暗黙の仮定に依存しています。事前承認済みの代替文言と完全一致する変更は自動適用し、逸脱と未分類の条項だけを弁護士に回すことで、統制の強さを保ったまま人手を実際にリスクのある箇所へ集中できます。最も紛らわしいのは変更点サマリでレビューを短縮する案で、負荷は下がりますが、レビュー対象が全件である構造は変わりません。", "p": "人手確認は全件か否かではなくリスク階層で配置し直す。"}, {"d": "D4", "q": "An engineering team gates every merge on an eval suite of 300 cases with a pass threshold of 95 percent. The suite is flaky: repeated runs on the same commit produce between 93 and 97 percent, so developers rerun until it passes. What should the architect change first?", "o": ["Set temperature to 0 and pin the model version so results become deterministic", "Lower the threshold to 92 percent so reruns are no longer necessary", "Quantify run to run variance by repeating the suite on an unchanged commit, gate on a statistic that accounts for that noise band, and split the suite into a deterministic assertion tier and a graded tier", "Grow the suite to 1000 cases so the percentage stabilizes", "Move the suite out of CI into a nightly job so merges are not blocked"], "a": [2], "e": "まず同一コミットで反復実行して変動幅を定量化しなければ、95%という閾値がノイズの内側にあるのか外側にあるのか判断できない。変動を測ったうえで、決定論的に真偽が決まるアサーション層と統計的に扱う採点層を分離するのが本筋である。temperature 0 と版固定は魅力的だが、推論基盤側の非決定性や判定器の揺れは残り、完全な再現は得られない。", "p": "フレーキーなゲートはまず変動幅を計測し、閾値をノイズに整合させる。"}, {"d": "D5", "q": "A telecom assistant summarizes call transcripts that contain names, addresses and payment card fragments. The current design instructs the model to omit personal data from summaries, and spot checks show it usually complies. Compliance now asks for assurance. What should the architect implement?", "o": ["A second model pass that reviews each summary and removes any personal data it finds", "Deterministic detection and tokenization of sensitive entities before the transcript reaches the model, with the token to value mapping in a controlled store and rehydration only for authorized viewers", "A strengthened prompt with explicit examples of prohibited output and a refusal instruction", "Logging of every summary plus a nightly scan that alerts when personal data appears", "Fine tuning the model on summaries that exclude personal data so the behavior is learned rather than instructed"], "a": [1], "e": "モデルが概ね守っているという観測は保証ではなく、コンプライアンスが求めるのは決定論的に成立する統制である。入力段で機微エンティティを検出してトークン化し、対応表を管理された保管庫に置いて権限のある閲覧者にだけ復元すれば、モデルが何を出力しても原文の個人データは外に出ない。二段目のモデルで除去する案は確率的な検査を重ねるだけで取りこぼしはゼロにならない。", "p": "確定的に守るべき要件はモデルの遵守ではなく前段の決定論的処理に置く。"}, {"d": "D6", "q": "A customer support deflection assistant is going live. The client's operations director asks the architect to write the service level objective. The assistant answers routine questions and escalates to a human when it is unsure. Which formulation makes the strongest SLO?", "o": ["The assistant will resolve at least 60 percent of incoming chats without escalation", "Of chats the assistant closes without escalation, no more than 2 percent per calendar month will be reopened by the customer within 48 hours, with a stated monthly error budget and a defined action when the budget is exhausted", "The assistant will maintain an average customer satisfaction score of at least 4.2 out of 5", "The assistant will be available 99.9 percent of the time during business hours", "The assistant will produce a correct answer at least 95 percent of the time as judged by a monthly sample of 100 chats reviewed by the support lead"], "a": [1], "e": "良いSLOは、測定対象・計測窓・エラーバジェット・超過時の行動が定義され、かつ悪い挙動を報酬しないものである。48時間以内の再オープン率は顧客側の客観行動で自動計測でき、誤答をエスカレーションせず閉じる行為を直接罰する。自己解決率60パーセントは、誤答してでも閉じるほど数値が良くなり、品質と逆方向のインセンティブを生む。", "p": "SLOは計測窓とエラーバジェットを伴い、逆インセンティブを生まない指標で定義する。"}, {"d": "D2", "q": "A team must answer questions across a 900 document construction contract archive of roughly 2.4 million tokens. The current design concatenates the 40 most recently modified documents into a single request. Accuracy on a 100 question benchmark is 51 percent, and most errors cite the wrong contract. What should the architect recommend?", "o": ["Retrieve at clause level with document and section metadata, rerank down to a small passage set, require the answer to cite the contract id and clause it used, and measure retrieval recall separately from answer accuracy", "Move to the model with the largest context window and pass all 900 documents in one request", "Summarize each of the 900 documents once, store the summaries, and answer every question from the summaries", "Split the archive by project, run one request per project, and have a final request merge the answers", "Increase the number of concatenated documents from 40 to 120 and raise the token budget"], "a": [0], "e": "誤りの大半が別契約の引用であることは、生成能力ではなく検索対象の選定が壊れている兆候である。条項単位で取得し、メタデータ付きで再ランクし、契約IDと条項の引用を強制すれば、誤帰属が検出可能になる。240万トークンは最大コンテキストにも収まらず、大量の無関係文脈は誤帰属をむしろ悪化させる。", "p": "誤帰属が主因なら、コンテキスト拡大ではなく検索粒度と引用強制で直す。"}, {"d": "D7", "q": "Select TWO. A CTO wants a single adoption KPI: the percentage of merged lines of code generated by Claude, with a target of 40 percent by quarter end. The architect is asked to set up the reporting. Which two responses should the architect give?", "o": ["Explain that the metric rewards volume of generated code and can be raised simply by generating more code than needed, and propose outcome measures instead, such as change lead time and change failure rate tracked against the pre rollout baseline", "Propose a small set of measures showing whether the tool is used for real work: the proportion of engineers using it weekly on production repositories, and post merge defect and revert rates compared with the baseline", "Accept the KPI and instrument the commit pipeline to attribute lines, since a single number is what leadership will act on", "Replace the KPI with total prompts sent per engineer per week, which is easier to collect reliably", "Report time saved per engineer from a monthly self assessment survey"], "a": [0, 1], "e": "生成行数比率は、冗長なコードを書くほど改善する逆インセンティブ指標であり、目標値を置くと確実に歪む。成果側（変更リードタイム、変更失敗率）と、実務での定着（本番リポジトリでの週次利用者比率、マージ後の欠陥・巻き戻し率）をベースライン比で示すべきである。誤った指標の精緻な計測は、誤った施策を加速する。", "p": "生成量の指標は、成果指標と実務定着指標に置き換える。"}, {"d": "D3", "q": "An MCP server exposes an internal HR system. It authenticates with a single service account that can read all employee records, and the agent is instructed in its system prompt to return data only about the requesting user. A security review is scheduled next month. What should the architect change?", "o": ["Propagate the end user identity to the MCP server and have the HR system authorize each request against that user's own entitlements", "Keep the service account and add a post generation redaction filter that removes employee data not belonging to the caller", "Rotate the service account credentials frequently and store them in a managed secrets service", "Reduce the service account to read only scope and log every query for later audit", "Keep the design but require the agent to include the caller identity in every tool call and rely on the prompt to prevent misuse"], "a": [0], "e": "プロンプトによる指示は認可の仕組みではなく、モデルが逸脱した瞬間に全社員データが露出します。エンドユーザーIDを伝播させ、HR側が本人の権限でリクエストを評価する設計に組み替えることで、認可判定がモデルの外側に移ります。最も紛らわしいのは生成後のリダクションフィルタで、実装は容易ですが、データはすでにモデルのコンテキストに入っており、フィルタの取りこぼしがそのまま漏えいになります。", "p": "認可はプロンプトや後処理ではなく呼び出し元IDの伝播で担保する。"}, {"d": "D1", "q": "A mid sized insurer needs document question answering for 200 underwriters. A vendor product covers 80 percent of the requirement out of the box for a fixed annual fee, while an internal build is estimated at 5 engineer months plus ongoing ownership. The missing 20 percent is a proprietary risk scoring workflow that is the firm's actual competitive differentiator. What should the architect recommend?", "o": ["Buy the vendor product for the commodity document question answering and build only the proprietary risk scoring workflow in house, behind a clear integration boundary", "Build the entire system in house so that the firm retains full control and avoids vendor lock in", "Buy the vendor product and pay the vendor to implement the risk scoring workflow as a customization", "Build a proof of concept of the full system in house first and decide on build versus buy afterwards", "Buy the vendor product and accept the 20 percent gap as a manual process for the foreseeable future"], "a": [0], "e": "build対buyは全体を一括で判断する問題ではなく、差別化要因かコモディティかという軸で機能を分割する問題です。汎用的な文書質問応答は購入し、競争優位の源泉であるリスクスコアリングだけを自社で持てば、投資が差別化領域に集中し、統合境界も明確になります。最も紛らわしいのはベンダーにカスタマイズを依頼する案で、最も価値の高いロジックの改善速度と知財を外部の開発計画に依存させてしまいます。", "p": "build対buyは全体ではなく差別化領域とコモディティ領域の境界で判断する。"}, {"d": "D4", "q": "A media company deployed an assistant that drafts article summaries for editors. Editors accept, edit or discard each draft. Six weeks in, leadership asks for a production quality metric. Offline eval scores have been stable throughout. What should the architect build first?", "o": ["A daily sample of production outputs scored by the same LLM judge and rubric used offline", "Editor action rates plus edit magnitude on accepted drafts, segmented by article type, validated by a small weekly human reviewed sample", "Thumbs up and thumbs down buttons added to the editor interface", "Token cost and p95 latency dashboards with alerts on regression", "Drafts generated per editor per day as a productivity proxy"], "a": [1], "e": "採用・修正・破棄という編集者の行動ログは、すでに存在する最も密度の高い品質信号であり、修正量まで見れば劣化の方向まで読み取れる。記事種別でセグメントし、週次で少量の人手レビューを当てて信号自体の妥当性を裏取りするのが実務的である。オフラインと同じ判定器を本番サンプルに当てる案は、オフラインが安定している状況では同じ盲点をそのまま本番に持ち込むだけになる。", "p": "本番品質は既存の人手行動ログを主信号にし、少量の人手レビューで裏を取る。"}, {"d": "D5", "q": "Select TWO. A lender logs every assistant interaction with timestamp, user id, full prompt, full response and latency. Six months later a regulator asks the team to explain how one specific declined application was assessed, and the team cannot reproduce the reasoning. Which two additions most directly close the gap?", "o": ["Version identifiers for the model, system prompt, tool schemas and policy configuration in effect at request time", "Identifiers and content versions of every retrieved document, plus every tool call and its returned result", "A stored chain of thought for each response", "Hash chaining of log records so tampering becomes detectable", "Longer log retention, extended from 12 months to 7 years"], "a": [0, 1], "e": "同じ入力でも、モデル版・システムプロンプト版・ツール定義・ポリシー設定が変われば結論は変わるため、判断時点の各バージョン識別子がなければ再現は原理的に不可能である。加えて参照した文書の識別子とその版、実行したツール呼び出しと戻り値がなければ、何を根拠に否決したかを説明できない。ハッシュチェーンや保持期間の延長は、記録されていない情報を復元できない。", "p": "再現可能性は各種バージョンと入力とツール結果の記録項目で担保する。"}, {"d": "D6", "q": "Eight weeks into a twelve week engagement to build an internal claims triage queue, the client's newly appointed head of digital asks to add a customer facing chat channel, work the architect estimates at five weeks. The original scope is on schedule for week 12, and the sponsor will not move the date. What should the architect do?", "o": ["Add the chat channel and staff a second developer in parallel to protect the week 12 date", "Decline the change and refer both stakeholders to the signed scope document", "Present the choice explicitly: deliver internal triage at week 12 as planned and fund the chat channel as a separate phase, or move the date to week 17, and ask the sponsor and the head of digital to record their joint decision", "Accept the change and absorb the five weeks by reducing the evaluation and handover work", "Build a limited chat prototype by week 12 and defer production hardening to an unscheduled later date"], "a": [2], "e": "固定日付・固定人員に新規スコープを加える要求は、そのままでは成立しない前提を含む。アーキテクトの役割は判断を代行することではなく、選択肢とその代償を明示し、対立する二人の意思決定者に共同で決めさせることである。8週目からの増員は立ち上げコストが回収できず、評価とハンドオーバーを削る案は運用移管の失敗として跳ね返る。", "p": "スコープ追加は吸収せず、代償付きの選択肢として意思決定者に返す。"}, {"d": "D2", "q": "An internal audit team requires that a risk classification service be reproducible: given the same application, it must produce the same result. The engineering team set temperature to 0 and told audit that the system is now deterministic. What should the architect do?", "o": ["Reset the framing with audit: define reproducibility as the same classification decision on re-run rather than byte identical text, log the exact input, prompt version and model version for every call, and measure re-run agreement on a fixed set of 500 applications against an agreed threshold", "Confirm the team's approach and document temperature 0 as the control that satisfies the requirement", "Cache every classification result so that a repeated application returns the stored output", "Pin the model version and set top_p to 0 as well, which removes the remaining variation", "Run each classification three times and return the majority result so that outputs are stable"], "a": [0], "e": "temperature 0は最尤トークンを選ぶ設定にすぎず、バイト単位の同一出力を保証しない。監査が必要としているのは同じ入力に対する同じ判定と、その判定を再現・説明できる証跡である。結果のキャッシュは再現ではなく再実行の回避であり、モデル更新時の判定変化を検出できない。", "p": "決定性の要求は、バイト一致ではなく判定一致と証跡の再現性に定義し直す。"}, {"d": "D7", "q": "A client team's runbook for a Claude based document pipeline was reviewed and approved by both sides. Three weeks later, during a real incident in which the extraction step began returning empty fields, the on-call engineer could not use it and called the vendor instead. The runbook is technically accurate and does cover the component. What should the architect do?", "o": ["Run a game day in which the on-call engineer resolves an injected version of that failure using only the runbook, observe where they stall, and restructure the runbook around the symptoms an on-call engineer actually observes rather than around components", "Add more detail to the runbook, including console screenshots and the exact commands to run", "Add a decision tree at the front mapping each component to its owner and escalation contact", "Require the client team to review the runbook monthly so that it stays fresh in their minds", "Add alerting on empty extraction results so that the on-call engineer is told which component failed"], "a": [0], "e": "レビューを通過した正確なランブックが実障害で使えなかったのは、記述の粒度ではなく入口の設計が誤っているためである。オンコール担当者は症状から入るのに、文書はコンポーネント構成から入っている。実際に注入した障害を担当者が文書だけで解く演習を行えば、詰まる箇所が観測でき、症状起点に再構成できる。", "p": "ランブックは症状起点で構成し、実演習で使えることを検証する。"}, {"d": "D3", "q": "A benefits assistant serves employees in Japan, Germany and Brazil. Retrieval frequently returns the German leave policy for Japanese employees because the documents are near duplicates in wording. The resulting answers are fluent and confidently wrong. What should the architect do first?", "o": ["Attach a country attribute to every chunk at ingestion and apply it as a hard filter, driven by the caller's profile, before ranking", "Add the employee's country to the system prompt and instruct the model to ignore documents from other countries", "Switch to a larger embedding model with better multilingual separation", "Increase top_k so that the correct country document is more likely to appear somewhere in the candidate set", "Merge the three country policies into one combined document per topic so retrieval always returns everything"], "a": [0], "e": "文面がほぼ同一の文書は埋め込み空間で近接するため、意味的類似度だけでは国別の区別が原理的に困難です。取り込み時に国属性をメタデータとして付与し、ランキング前のハードフィルタとして適用すれば、誤った管轄の文書は候補にすら入りません。最も紛らわしいのはプロンプトで国を伝えて無視させる案ですが、誤った文書がコンテキストに入る限り混入は確率的に残り、決定論的な保証にはなりません。", "p": "意味的に区別できない属性はメタデータフィルタで決定論的に切る。"}, {"d": "D1", "q": "An executive sponsor mandates that the most capable model be used at every step of a document processing pipeline because quality is critical. The pipeline has six steps including format detection, field extraction, cross document reconciliation and a final narrative summary. Cost is running four times the plan, and step level accuracy has never been measured. What should the architect recommend?", "o": ["Build a per step evaluation set, then assign to each step the smallest model that meets its accuracy target, keeping the most capable model where evaluation shows it is needed", "Keep the mandate and reduce cost through prompt caching and shorter prompts", "Move the whole pipeline to a smaller model and add a verification pass at the end", "Run the pipeline as an overnight batch to obtain a lower unit price", "Cache results for repeated documents and leave the rest of the design unchanged"], "a": [0], "e": "全ステップに最上位モデルという方針は、各ステップの難易度が同じという検証されていない仮定に立っており、実際に形式判定と要約では要求水準が大きく異なります。ステップ単位の評価セットを作れば、どこで小型モデルが十分かを事実で示せ、品質を守りながらコストを配分し直す根拠になります。最も紛らわしいのはキャッシュとプロンプト短縮でコストを下げる案で、有効ではありますが四倍の乖離を埋めるには不十分です。", "p": "モデル選定は一律指定ではなくステップ別の評価に基づいて分配する。"}, {"d": "D4", "q": "Finance mandates a 40 percent inference cost reduction for a document classification service that currently sends every document to a large model. The head of product proposes swapping in a small model everywhere and accepting a small accuracy drop. Current accuracy is 94 percent, and downstream teams have no tolerance for misrouted contract documents. What should the architect propose?", "o": ["Accept the swap and add a human review queue for everything the small model classifies", "Measure per document type accuracy of the small model, route only the types where it matches the large model within the agreed margin, escalate the rest by confidence, then recompute the cost saving", "Keep the large model and pursue the savings through prompt shortening and caching of repeated documents", "Fine tune the small model on historical labels and swap it in once its aggregate accuracy reaches 94 percent", "Swap in the small model and run the large model asynchronously on a 5 percent sample to detect drift"], "a": [1], "e": "一律置換は、契約書のように誤分類コストが極端に高い種別まで同じ許容度で扱ってしまう点が致命的である。文書種別ごとに小型モデルの精度を測り、大型と同等の種別だけに振り向け、残りは信頼度で上位モデルへエスカレーションすれば、精度要件を守ったままコスト目標に近づける。ファインチューニングで全体精度を戻す案は、集約値が同じでも契約書サブセットの劣化を排除できない。", "p": "一律置換ではなくセグメント別性能に基づく振り分けで精度・コスト・遅延を解く。"}, {"d": "D5", "q": "A content moderation guardrail sits in front of a customer facing assistant. During a traffic spike the guardrail service times out. The current behavior is to log the timeout and let the response through. What should the architect change?", "o": ["Define per action risk tiers, fail closed for high risk responses with a safe fallback message, allow low risk paths to proceed in an explicitly marked degraded mode, and alert on the degraded mode rate", "Fail closed for all traffic whenever the guardrail is unavailable so no unchecked response reaches a customer", "Increase the guardrail timeout and add retries so timeouts become rare", "Run the guardrail asynchronously and retract or correct any response later found to violate policy", "Deploy a smaller local guardrail model as a fallback whenever the hosted one times out"], "a": [0], "e": "可用性と安全性の衝突は二択で解くものではなく、行為のリスク階層で解く問題である。高リスク応答は安全側に倒して定型メッセージを返し、低リスク経路は縮退モードであることを明示したうえで通し、縮退モードの発生率自体を監視対象にするのが妥当な設計になる。全面fail closedは低リスク経路まで停止して障害を拡大し、現場がガードレールを迂回する圧力を生む。", "p": "制御の縮退はリスク階層ごとに fail closed と fail open を定義する。"}, {"d": "D6", "q": "Compliance requires every answer from an internal policy assistant to carry full source citations and a legal disclaimer, roughly 180 additional words. The sales enablement group says the answers are then unusable during a live call and wants citations removed. Both groups have escalated to the architect. What should the architect recommend?", "o": ["A compromise format with one shortened citation and no disclaimer, applied to all answers", "Classify questions by risk: keep full citations and the disclaimer for the regulated topics compliance names, return a short answer with citations available on expand for the rest, and have both groups sign off on the topic list", "Keep the compliance format as the single default, since regulatory requirements outrank usability preferences", "Give each group its own deployment and its own prompt so neither blocks the other", "Return short answers by default and write full citations to an audit store that compliance can query later"], "a": [1], "e": "対立の前提は、全ての回答が同一の形式でなければならないという暗黙の仮定にある。リスク区分を導入し、規制対象トピックだけ完全な引用と免責を維持すれば、両者の実際の要件を同時に満たせる。監査ストアに引用を退避する案は、閲覧者本人に根拠が提示されるという要件を満たさない。", "p": "対立するステークホルダー要求は、単一フォーマットの前提を崩してリスク区分で分ける。"}, {"d": "D2", "q": "A document intake pipeline has four steps: page classification, field extraction, cross document consistency checking, and a final approve or refer recommendation. The team runs the highest model tier on all four steps. Volume is 30,000 documents per day and cost is 3.4 times budget. Per step evaluation shows steps 1 and 2 score above 98 percent on the smallest tier, while step 4 falls from 91 percent to 74 percent. What should the architect recommend?", "o": ["Assign the smallest tier to steps 1 and 2, keep the highest tier for step 4, evaluate step 3 on its own before deciding, and gate every change on the per step evaluation sets", "Move the entire pipeline to the smallest tier and add a human review queue for low confidence cases", "Keep the highest tier throughout and negotiate volume pricing, since step 4 accuracy carries the business risk", "Use the mid tier for all four steps as a balanced compromise", "Tune prompts for the smallest tier on step 4 until it matches, then move the whole pipeline to the smallest tier"], "a": [0], "e": "モデル選定はパイプライン単位ではなくステップ単位の判断であり、既に各ステップの評価データが揃っている。分類と抽出は小型で98パーセント超なので降格し、判断が要る第4ステップは上位を維持し、未測定の第3ステップは測ってから決めるのが筋である。全段を中間階層に揃える折衷案は、第1第2で不要なコストを払い第4で必要な精度を失う。", "p": "モデル階層はパイプライン一括ではなくステップ単位の評価で決める。"}, {"d": "D3", "q": "A knowledge assistant over 300 thousand documents misses the correct passage about 25 percent of the time. The product owner asks to raise top_k from 5 to 50 so the answer is always somewhere in context. Evaluation shows recall at 50 reaches 96 percent, but answer accuracy drops slightly and cost per query triples. What should the architect recommend?", "o": ["Retrieve a wide candidate set, then rerank it and pass only the few best passages to the model", "Adopt top_k of 50 as requested, since recall is the binding constraint and the cost is acceptable", "Keep top_k at 5 and fine tune the generation model on the domain corpus", "Raise top_k to 50 but shorten every chunk so that total context tokens stay flat", "Add a second retrieval pass with query rewriting, triggered only when the first pass returns low scores"], "a": [0], "e": "再現率と回答精度は同じ指標ではなく、無関係な文書を大量に渡すと注意が分散して精度が下がるという評価結果がそれを示しています。候補を広く取ってからリランクし、モデルには上位数件だけを渡す二段構成にすれば、高い再現率とコンテキストの簡潔さを同時に満たせます。最も紛らわしいのは要求どおりtop_kを50にする案で、再現率という単一指標では改善に見えますが、観測されている精度低下とコスト三倍をそのまま受け入れることになります。", "p": "再現率の要求はtop_k拡大ではなく候補生成とリランクの分離で満たす。"}, {"d": "D1", "q": "A platform team wants to automate first line investigation of production incidents. Investigations vary widely: some need two log queries, others need a dozen steps across metrics, deploys and configuration history, and the path depends on what each step reveals. The existing fixed five step runbook resolves only 20 percent of incidents. What should the architect recommend?", "o": ["Use an agent loop with a bounded set of read only investigation tools, an explicit step and token budget, and a handoff to a human with its findings when the budget is exhausted", "Extend the fixed runbook from five to twenty steps to cover the variety observed in practice", "Build one specialized agent per signal source and run all of them in parallel for every incident", "Keep the runbook as is and use the model only to summarize its output for the on call engineer", "Let the agent run without step limits, since incidents differ widely and a premature cutoff destroys the value"], "a": [0], "e": "次に何を調べるかが前段の結果に依存し、必要ステップ数が事前に決まらない探索的タスクは、決定論的ワークフローではなくエージェントループが適合する典型例です。ただし本番運用では読み取り専用のツール集合と、ステップ数やトークンの明示的な上限、上限到達時の人への引き継ぎを設計に組み込む必要があります。最も紛らわしいのはランブックを20ステップに拡張する案ですが、分岐は組み合わせ的に増え、保守不能な決定木になります。", "p": "経路が事前に決まらない探索的タスクは予算上限付きのエージェントループで扱う。"}, {"d": "D4", "q": "An online travel company is A/B testing a new itinerary assistant. After 2 days the treatment shows a 3 percent lift in booking conversion with a p value of 0.04, and the VP wants to ship on Friday. No target effect size or test duration was set before launch. What should the architect require before shipping?", "o": ["Run until the pre computed sample size for the agreed minimum detectable effect is reached, cover at least one full weekly cycle, and check guardrail metrics such as cancellation and support contact rates", "Rerun the same test with fresh randomization to confirm the result replicates", "Raise the treatment allocation to 50 percent so significance is reached sooner", "Ship to 100 percent while keeping a holdback group for four weeks to monitor long term effects", "Accept the result since p is below 0.05 and watch the conversion dashboard in production"], "a": [0], "e": "最小検出効果とサンプルサイズ、観測期間を事前に決めないまま2日目のp値で停止するのは覗き見であり、偽陽性率は名目の5%を大きく超える。旅行予約は曜日効果が強いため最低1週間の周期を含め、キャンセル率や問い合わせ率といったガードレール指標を同時に評価する必要がある。ホールドバックを残して全量投入する案は、判断根拠が不確かなまま全ユーザに影響を出す点で順序が逆である。", "p": "効果量と期間を事前に決めない検定は覗き見であり、ガードレール指標と併せて判断する。"}, {"d": "D5", "q": "An enterprise customer requires evidence of an AI management system aligned with ISO/IEC 42001 before renewing. The company has strong ML engineering practice, but governance lives in engineering wikis. A director proposes writing a policy pack that maps each clause to a document within four weeks. What should the architect advise?", "o": ["Proceed with the policy pack, since documented policies are what auditors sample", "Adopt the NIST AI RMF instead, because it is voluntary and cheaper to evidence", "Start from an inventory of AI systems with named owners, a risk assessment per system, and operating routines such as change approval, incident handling and periodic review, then let the document set follow from routines that actually run and produce records", "Engage a certification body first so that audit scope determines which documents are needed", "Ask the customer to accept the existing SOC 2 Type II report, since it already covers change management and access control"], "a": [2], "e": "マネジメントシステムの実体は文書一式ではなく、実際に回る運用とその記録である。AIシステムの棚卸しと責任者、システムごとのリスク評価、変更承認・インシデント対応・定期レビューといった運用ルーチンを先に定め、そこから生じる記録に文書を対応付ける順序が正しい。条項対応の文書パックは4週間で作れても、審査で問われるのは運用の証跡である。", "p": "マネジメントシステムは文書一式ではなく運用と記録から構築する。"}, {"d": "D6", "q": "Select TWO. A three month proof of concept for an engineering knowledge assistant is ending. The architect must define exit criteria that decide whether the work continues, changes, or stops. Which two belong in that definition?", "o": ["A named business owner who has accepted the operating cost and staffing for the next phase, agreed before the decision meeting", "A pre-agreed threshold on the primary outcome metric, for example median search to answer time below 4 minutes on the 120 task benchmark, with the stop decision defined in advance if it is not met", "Confirmation that the assistant runs on the current top model tier", "A signed statement from participating engineers that they found the tool enjoyable to use", "Evidence that the assistant handled at least 10,000 queries during the proof of concept"], "a": [0, 1], "e": "exit criteriaは、決定会議の前に合意されていなければ意味がない。必要なのは、事前に閾値と不達時の停止判断まで定義された成果指標と、次フェーズの費用と要員を引き受ける実名のオーナーである。クエリ数1万件は活動量にすぎず、停止判断の根拠にならない。", "p": "exit criteriaは事前合意の閾値と、次フェーズを引き受ける実名オーナーで構成する。"}, {"d": "D2", "q": "A Japanese language customer assistant runs on an English system prompt with English few shot examples. Users write in Japanese and the answers are factually accurate, but reviewers complain that the politeness register drifts between plain and formal forms and that some replies contain English fragments. What should the architect change?", "o": ["State the required output language and politeness register explicitly in the system prompt, replace the few shot examples with Japanese examples written in the target register, and add a register check to the review rubric", "Translate the entire system prompt into Japanese, since models follow instructions best in the user's language", "Add a second pass that translates any English fragments into Japanese before the reply is returned", "Lower the temperature so that wording varies less between replies", "Append an instruction to every user message repeating that the reply must be in Japanese"], "a": [0], "e": "敬体と常体の揺れは、出力言語と文体が明示されておらず、少数例が英語のままで文体の手本になっていないことに起因する。指示で言語と敬語レベルを明示し、少数例を目標文体の日本語に差し替えるのが直接的な修正である。システムプロンプト全体の日本語化より、出力仕様の明示と例の文体の方が支配的である。", "p": "多言語出力の揺れは、出力言語と文体の明示と、その文体で書かれた少数例で抑える。"}, {"d": "D3", "q": "An order status agent depends on a fulfillment API that has had two 40 minute outages this quarter. During those outages the agent produced plausible but invented delivery dates. What should the architect implement?", "o": ["Detect tool failure explicitly and enter a declared degraded mode that returns the last cached status with its timestamp and states that live data is unavailable", "Add aggressive retries with exponential backoff so that requests eventually succeed", "Instruct the model in the system prompt to say that it does not know whenever a tool fails", "Return an error page and end the conversation whenever the fulfillment API is unreachable", "Cache all fulfillment responses for 24 hours and serve them transparently to every request"], "a": [0], "e": "障害時に最も危険なのは、ツール失敗がモデルにとって単なる情報欠落として扱われ、もっともらしい値を補完してしまうことです。失敗を明示的に検出し、キャッシュ済みの最終確認時刻を添えて縮退応答であることを利用者に伝える経路を設ければ、可用性と正直さの両方を確保できます。最も紛らわしいのは24時間キャッシュを透過的に配信する案で、可用性は上がりますが、古い情報が新鮮なものとして提示され、誤情報の性質は変わりません。", "p": "障害時の縮退はプロンプト任せにせず、明示的な検出と鮮度表示で設計する。"}, {"d": "D1", "q": "A proof of concept assistant was demonstrated successfully using about 30 questions the project team wrote themselves. Leadership approved a production rollout to 2000 users next quarter. The team plans to spend the quarter on infrastructure: autoscaling, an API gateway and logging. What should the architect insist on adding to the plan?", "o": ["A representative, versioned evaluation set drawn from real user requests with agreed pass criteria, executed automatically on every prompt or model change", "A larger set of team written test questions covering a broader range of topics", "A thumbs up and thumbs down feedback widget so that quality signals are collected after launch", "A canary rollout to 5 percent of users before opening the system to everyone", "A manual review by domain experts of the first week of production transcripts"], "a": [0], "e": "自作30問での成功は、実利用の分布を代表していないため、本番品質の予測にはなりません。実際のユーザー要求から構築した代表性のある評価セットを版管理し、プロンプトやモデルの変更ごとに自動実行して初めて、回帰を検知しながら安全に運用を進められます。最も紛らわしいのはカナリアリリースで、ほぼ必須の良い施策ですが、品質を測る基準がなければ何を見て中止判断をするのかが定まりません。", "p": "PoCから本番への移行はインフラより先に再現可能な評価基盤を用意する。"}, {"d": "D4", "q": "A team has 1200 production conversations flagged as unsatisfactory. An engineer proposes labeling all of them with the five buckets from the original design document: retrieval miss, hallucination, tone, refusal, formatting. After 200 labels, 41 percent land in the other bucket. What should the architect do next?", "o": ["Fold the other bucket into hallucination, since most unclassified failures are ultimately factual problems", "Open code a random sample of the other cases to derive categories from the data, revise the taxonomy, then relabel with a measured inter labeler agreement check", "Have an LLM assign the remaining cases to the five existing buckets with reasoning traces attached", "Label all 1200 cases so the other bucket becomes statistically meaningful", "Keep other as a sixth bucket and prioritize fixes for the four largest known buckets"], "a": [1], "e": "41%がその他に落ちるのは、分類体系が現象を捉えていないという明確な兆候であり、既存バケットへの押し込みは失敗の実体を隠す。その他のサンプルをオープンコーディングして帰納的にカテゴリを作り、体系を改訂したうえでラベラー間一致を測って再ラベルするのが正攻法である。LLMに既存5分類へ割り当てさせる案は、欠陥のある分類体系をそのまま自動化し、見かけ上その他を消してしまう。", "p": "失敗分類は事前定義に押し込めず、データから帰納して改訂する。"}, {"d": "D5", "q": "A user reports that an assistant response contained another customer account number. The feature is live for 40000 users. What sequence should the architect direct immediately?", "o": ["Contain by disabling the capability or narrowing its data scope, preserve logs and the exact request, use the audit trail to bound how many other responses could be affected, and notify privacy and legal per the incident policy", "Reproduce the issue in staging to confirm it is real before taking any production action", "Patch the retrieval filter, deploy the fix, and then investigate historical impact", "Rotate credentials and invalidate sessions for the affected accounts, then investigate", "Notify all 40000 users of a potential data exposure while the investigation proceeds"], "a": [0], "e": "情報漏えいの疑いでは封じ込めと証拠保全が最優先であり、機能の停止またはデータスコープの縮小によって被害の継続を止めることが最初の行動になる。次にログと当該リクエストを保全し、監査証跡から同種の応答がどれだけ発生し得たかを洗い出したうえで、privacyとlegalに手順どおり連絡する。修正を先に当てる案はデプロイによって証拠となる状態が変わり、影響範囲の特定が著しく困難になる。", "p": "インシデントは封じ込めと証拠保全を先に行い、影響範囲は監査証跡で測る。"}, {"d": "D6", "q": "A client's internal platform team is due to take over a Claude based document processing pipeline in six weeks. They have read the design documents and attended demonstrations. The architect wants evidence that the handover is real. Which approach gives the strongest evidence?", "o": ["Have the client team hold primary on-call for four of the six weeks, handling real incidents and the weekly prompt and evaluation update, with the vendor available only as second line and logging every question it is asked", "Run a certification quiz on the architecture and require a score of 80 percent to pass", "Record walkthrough videos of each component and store them alongside the repository", "Extend vendor support for three months after go live so the team can ask questions while learning", "Have the client team rewrite the runbook in their own words and review it with the vendor"], "a": [0], "e": "運用能力は、実際の障害と定期作業を自力で回した実績でしか確認できない。クライアント側を一次オンコールに置き、ベンダーを二次に下げ、受けた質問を記録すれば、残っている知識ギャップが定量的に見える。サポート延長は依存を温存し、移管完了の判定を先送りするだけである。", "p": "移管の完了は、実障害を自力処理した実績で判定する。"}, {"d": "D2", "q": "Select TWO. A planning assistant holds conversations that regularly reach 300 turns. Users report that constraints stated early, such as a budget ceiling and two excluded vendors, stop being respected after roughly turn 60. The current design truncates the oldest turns. Which two changes should the architect make?", "o": ["Maintain an explicit structured state object holding confirmed constraints and decisions, updated as they are agreed, and include it in every request", "Summarize displaced turns into a running summary carried forward, and reconcile that summary against the state object rather than letting it replace the object", "Increase the truncation limit so that more raw turns fit inside the window", "Move to the largest available context window and stop truncating altogether", "Restate the full conversation history at the beginning of every request"], "a": [0, 1], "e": "制約が失われるのは、単純な古い順の切り捨てが情報の重要度を区別しないためである。確定した制約と決定を構造化された状態オブジェクトとして保持し毎回同梱すれば、会話長に関係なく制約が生き続ける。最大コンテキストへの移行は、300ターンの会話が伸び続けるため上限を後ろにずらすだけの延命である。", "p": "長い会話は切り捨て幅の調整ではなく、確定状態の明示保持と要約の突き合わせで守る。"}, {"d": "D3", "q": "A claims agent must call a mainframe SOAP service that takes 25 to 60 seconds and sometimes times out at 90 seconds. Users currently sit in the chat window with no feedback and abandon the session. The mainframe team cannot change the service this year. What should the architect design?", "o": ["Wrap the mainframe call as an asynchronous job: the tool returns a job reference immediately, the agent tells the user what is happening, and the result is delivered on completion", "Raise the agent's tool timeout to 120 seconds and display a spinner for the duration", "Issue the mainframe call three times in parallel and use whichever response returns first", "Pre fetch claim data for every active customer nightly and serve the agent from that copy", "Move the mainframe call into a subagent so that the main agent remains responsive"], "a": [0], "e": "数十秒級のレガシー呼び出しを同期ツールとして扱う限り、会話ループ全体がその遅延に人質に取られます。呼び出しを非同期ジョブ化し、ツールは即座に受付IDを返して結果は完了時に配信する形にすれば、会話は継続でき、タイムアウト時の再送も安全に設計できます。最も紛らわしいのはタイムアウトを120秒に延ばす案で、実装は最小ですが、利用者の離脱という実際の問題は何も解決しません。", "p": "長時間かかる基幹系連携は同期ツールではなく非同期ジョブ境界に切り出す。"}, {"d": "D1", "q": "A single prompt asks the model to read a 40 page RFP, extract requirements, judge which ones are in scope, estimate effort, and produce a draft response section. Quality is inconsistent, and when the output is wrong the team cannot tell which part failed. Rewriting the prompt three times has not helped. What should the architect do?", "o": ["Decompose the task into separate steps with a validated structured output between each one, so that every step can be measured and corrected independently", "Move the instructions into a longer system prompt and add few shot examples covering the whole task", "Increase the output token limit and ask the model to show its reasoning for each of the five subtasks", "Split the RFP into ten page sections and run the same combined prompt four times", "Assign the work to a multi agent system with one agent per paragraph of the current prompt"], "a": [0], "e": "一つのプロンプトに抽出、判断、見積り、起草という性質の異なる作業を詰め込むと、失敗の所在が観測できず、改善が当て推量になります。ステップに分解し、間に検証可能な構造化出力を挟めば、各ステップに個別の評価と修正を適用できます。最も紛らわしいのはfew shot例を足す案で、既に三度の書き換えが効かなかった事実が、問題が表現ではなく責務の混在にあることを示しています。", "p": "単一巨大プロンプトの品質問題は表現改善ではなく責務分解で解く。"}, {"d": "D4", "q": "A RAG based policy assistant improved from 78 to 88 percent on the offline eval after a retriever change, but in the first week online the escalation rate rose. What should the architect investigate first?", "o": ["Whether the offline eval corpus matches what production actually retrieves from, including index freshness, permission filtering and document versions", "Whether the new retriever added enough latency that users gave up and escalated", "Whether the offline LLM judge is biased toward the output style the new retriever produces", "Whether the escalation rise is explained by a seasonal shift in the question mix", "Whether the generation prompt needs to be updated for the new retrieval format"], "a": [0], "e": "オフラインで改善し本番で悪化する場合、最も多い原因は評価環境と本番環境の入力側の差である。インデックスの鮮度、権限フィルタ適用後に実際に見える文書、文書のバージョンが評価スナップショットと異なれば、同じリトリーバでも本番は別物として振る舞う。特に権限フィルタは評価時に無効化されがちで、本番でのみ再現する劣化を生みやすい。", "p": "オフラインと本番の乖離はまず入力とコーパスと権限の環境差を疑う。"}, {"d": "D5", "q": "An HR assistant reads and updates employee records through a tool. The current design passes the requesting employee id inside the prompt and instructs the model to access only records that person is entitled to see. A manager reports that the assistant returned a peer salary after a user asked several times in different ways. What should the architect require?", "o": ["The tool must enforce authorization server side using an access token bound to the authenticated end user, so out of scope records cannot be retrieved regardless of what the model requests", "A guardrail model that inspects each tool call and blocks requests for records outside the requester organization", "A stricter system prompt with explicit refusal examples and a jailbreak resistant instruction hierarchy", "An allow list of record fields the tool may ever return, configured per assistant deployment", "A confirmation step where the assistant asks the user to attest that they are entitled to view the record"], "a": [0], "e": "認可をプロンプト内の識別子とモデルの自制に委ねている限り、しつこい要求や言い換えによって境界は破られる。ツール側が認証済みエンドユーザに紐づくトークンで権限を評価し、範囲外のレコードはそもそも取得できない構造にすれば、モデルが何を要求しても結果は変わらない。ガードレールモデルは追加の防御層としては有用だが、一次統制に据えると誤判定のたびに越境を許す。", "p": "認可はモデルの遵守ではなく認証済みユーザに紐づくサーバ側で強制する。"}, {"d": "D6", "q": "An executive sponsor saw a demonstration built on a copy of production data and told the board the system will be live in six weeks. The architect knows that data access approval for the live production source takes about ten weeks and has not yet been started. What should the architect do first?", "o": ["Start the approval process immediately and inform the sponsor that the date is at risk", "Return to the sponsor with a restructured plan: a week 6 release limited to the two sources already approved and covering the highest volume use case, with the remaining sources gated on the approval milestone and a dated checkpoint, and ask the sponsor to confirm which of these the board announcement refers to", "Build against the demonstration data copy so the week 6 date is met, then swap the data source when approval lands", "Ask the sponsor to correct the board and commit to a sixteen week date", "Escalate to the data governance owner and request an expedited approval path that fits the six week date"], "a": [1], "e": "スポンサーは既に対外的に日付を宣言しており、単に危険だと伝えるだけでは意思決定材料にならない。承認済みの2ソースだけで最大volumeのユースケースを6週で出し、残りは承認マイルストーンに紐づけた期日付きチェックポイントに置き、どちらが取締役会向けの宣言に相当するかをスポンサー自身に確定させる。危険だと報告するだけの案は、意思決定を返していない。", "p": "守れない日付は否定せず、その日付で出せる範囲に再定義して返す。"}, {"d": "D2", "q": "A ticket triage prompt contains a system prompt rule stating that any message mentioning data loss must be tagged priority P1, plus six few shot examples added over time by different engineers. Two of those examples tag a data loss message as P2. In production, about 30 percent of data loss tickets are tagged P2. What should the architect do first?", "o": ["Correct the two conflicting examples so that every example matches the stated rule, then re-run the evaluation set before considering any further prompt change", "Strengthen the wording of the rule in the system prompt, for example by adding always and without exception", "Move the rule to the end of the prompt so that it is the last instruction the model reads", "Remove all few shot examples and rely on the written rules alone", "Add deterministic post processing that upgrades any data loss ticket to P1"], "a": [0], "e": "少数例は事実上の仕様であり、規則文と矛盾する例があれば例の方が強く効く。まず矛盾する2件を規則に一致させ、評価セットで効果を測るのが最小かつ因果に直接届く修正である。後処理で強制昇格させる案は症状を消すが、プロンプトは誤った規則を教え続け、類似の判断で同じ矛盾が別の形で表面化する。", "p": "少数例と規則文が矛盾するときは、例の方が仕様として効いている。"}, {"d": "D3", "q": "An analytics agent has a run_sql tool that accepts any SELECT statement against the production warehouse. It demos well, but in production it writes queries that scan billions of rows, joins on the wrong keys, and returns figures that conflict with the official dashboard. The data team asks for a longer tool description listing the correct join keys. What should the architect recommend?", "o": ["Replace the open ended SQL tool with a small set of parameterized query tools built on the certified metric definitions, and keep raw SQL out of the agent's hands", "Expand the tool description with the full schema, the join keys and worked example queries as the data team requested", "Add a query cost validator that rejects expensive statements and let the agent retry with a cheaper query", "Give the agent read access to a smaller sampled replica of the warehouse instead of production", "Add a second model pass that reviews and corrects the generated SQL before execution"], "a": [0], "e": "数値が公式ダッシュボードと食い違う根本原因は、指標の定義がエージェント側で毎回再発明されていることであり、説明文をいくら詳細にしても再発明そのものは止まりません。認定済みの指標定義の上にパラメータ化されたクエリツールを数個用意すれば、結果の一貫性とコストの上限が構造的に保証されます。最も紛らわしいのは要求どおり説明文を拡充する案で、正しい方向の改善に見えますが、確率的な生成に正確性を依存させ続ける点は変わりません。", "p": "自由記述SQLの品質問題は説明文強化ではなくツール粒度の再設計で解く。"}, {"d": "D1", "q": "Select TWO. A customer service agent can issue goodwill refunds. Compliance initially requires supervisor approval for every refund, which adds about 6 hours of latency and cancels the business case. Refunds average 12 dollars and 98 percent are under 50 dollars. Which TWO changes should the architect propose in order to preserve the control objective while restoring the business case?", "o": ["Give the agent a bounded refund authority, for example up to 50 dollars per case with per customer and per day caps, enforced in the refund service rather than in the prompt", "Replace per case approval with continuous monitoring: automated alerts on refund rate anomalies plus supervisor review of a risk weighted sample", "Keep per case approval but route requests to a shared supervisor queue so that any available supervisor can approve them faster", "Allow the agent to issue any refund and reverse the incorrect ones later through the existing chargeback process", "Have the model self assess its confidence for each refund and escalate only the low confidence cases"], "a": [0, 1], "e": "統制の目的は不正や過大な払い戻しの防止であり、それは事前の全件承認だけでなく、権限上限と事後の監視の組み合わせでも達成できます。金額と頻度の上限を払い戻しサービス側で強制すれば、モデルが逸脱しても損害額が構造的に限定され、リスク加重サンプリングと異常検知が残余リスクを捕捉します。共有キューによる承認高速化は待ち時間を多少縮めるだけで、全件人手という制約は残ります。", "p": "全件事前承認は権限上限と事後監視の組み合わせに再構成できる。"}, {"d": "D4", "q": "Select TWO. A team is building an evaluation harness for a multi step agent that books internal meeting rooms using four tools. Final booking success across 120 scenarios is 86 percent, but operations reports frequent odd behavior. Which two additions give the most diagnostic value?", "o": ["Trajectory level assertions on tool call sequences, covering unnecessary, repeated and out of order calls", "A per step judge that scores whether each tool call was justified by the conversation state up to that point", "Raising the scenario count from 120 to 500 while keeping outcome only scoring", "Recording total token usage and wall clock time per scenario", "Scoring the final confirmation message for tone and clarity"], "a": [0, 1], "e": "最終成功率だけを見ていると、正しい結果に至る過程で不要なツール呼び出しや重複予約の試行が起きていても検出できない。軌跡レベルのアサーションで呼び出し順序や重複を明示的に検査し、各ステップの妥当性をその時点の会話状態に照らして採点すれば、86%の内訳と奇妙な挙動の所在が特定できる。シナリオ数を増やしても観測対象が最終成果のままなので診断力は上がらない。", "p": "エージェント評価は最終成果だけでなく軌跡と各ステップの妥当性を見る。"}, {"d": "D5", "q": "Select TWO. An operations agent can restart services, scale clusters and delete stale customer data sets. Leadership wants fewer manual approvals, noting that engineers approve almost everything anyway. Which two changes reduce approval load without weakening control over irreversible actions?", "o": ["Classify actions by reversibility and blast radius, and auto approve only the reversible low blast radius ones while keeping explicit approval for deletions", "Replace immediate deletion with a soft delete plus a delay window and a restore path, so the action becomes reversible and no longer needs synchronous approval", "Keep approval for every action but let a single click approve a queued batch", "Let the agent proceed automatically when its stated confidence exceeds a threshold, logging the decision for later review", "Require approval only when the agent has already failed the same action once"], "a": [0, 1], "e": "承認疲れの本質的な解は承認を省くことではなく、危険な行為を可逆に作り替えて承認の必要性そのものを下げることである。可逆性と影響範囲で行為を分類し、可逆かつ影響の小さい操作だけを自動承認とし、削除は論理削除と猶予期間と復旧経路によって実質的に取り消し可能にすれば、統制を弱めずに承認件数を減らせる。一括承認は確認の質を下げたまま件数だけを減らす。", "p": "承認負荷は承認の省略ではなく行為の可逆性を設計で変えて減らす。"}, {"d": "D6", "q": "Six weeks after launch, the project team credits a Claude based invoice exception handler with 3,100 hours saved per year. The client's finance controller disputes the figure and argues that exception volumes were already falling. What should the architect propose?", "o": ["Recalculate the saving using the controller's own hourly cost rate and reissue the number", "Agree the measurement design with the controller now: route a randomly selected 15 percent of exceptions down the manual path for eight weeks, compare handling time and rework between the two paths, and let finance own the resulting number", "Present the 3,100 hour figure as a range with stated assumptions and let the controller choose a point within it", "Switch to a metric the controller cannot dispute, such as the number of exceptions processed by the system", "Ask the operations team to certify the hours saved based on their experience of the change"], "a": [1], "e": "数字が争われているのは計算方法ではなく、因果の帰属である。母集団の一部を手動経路に残す比較群を設ければ、需要減少などの外部要因を差し引いた効果が測れ、しかも数値の所有者を財務に移せる。レンジ提示は比較群がない限り前提そのものが争点として残る。", "p": "効果額の争いは、計算の修正ではなく比較群を含む測定設計の合意で解く。"}, {"d": "D3", "q": "Select TWO. A new MCP server will expose write operations to a CRM: creating opportunities, updating amounts, and sending customer emails. The team plans to ship it with the same conventions as their existing read only server. Which TWO design measures should the architect require before rollout?", "o": ["Accept a caller supplied idempotency key on every write tool so that a retry after a timeout cannot create duplicate records", "Place irreversible actions such as sending customer email behind an explicit confirmation step that shows the exact payload to a human", "Return the complete updated CRM record from every write tool so the model can verify what changed", "Set temperature to zero for every conversation that may involve a write operation", "Merge the write operations into one generic crm_write tool to keep the total tool count low"], "a": [0, 1], "e": "書き込みツールでは、ネットワークタイムアウト後の再試行が二重登録を生む点が最大の実務リスクであり、冪等キーの受け口を最初から契約に含める必要があります。顧客へのメール送信のように取り消せない操作は、実際に送られるペイロードを人が見て承認する境界を通すことで、誤起動の影響を封じ込められます。全レコードを返す案は検証に役立ちそうに見えますが、コンテキストを膨張させるうえ重複作成を防ぐ効果はありません。", "p": "書き込み系ツールは冪等性と不可逆操作の人手確認境界を設計の前提にする。"}, {"d": "D1", "q": "Two stakeholder groups disagree about the scope of a new internal helpdesk assistant. One wants it to handle every request type on day one, the other wants password resets only. Eighteen months of ticket history is available. What should the architect do first?", "o": ["Analyze the ticket history for volume, handling cost and resolution variability per request type, and scope the first release where automation value and feasibility are both high", "Start with password resets because it is the safest scope, then expand later based on user feedback", "Design an architecture capable of every request type and enable them progressively behind feature flags", "Survey helpdesk staff about which request types they find most frustrating to handle", "Split the difference and implement the five request types that both groups happen to mention"], "a": [0], "e": "スコープの対立は意見の調停ではなく、既に存在するデータで解ける問題です。18か月分のチケットを件数、処理コスト、解決手順のばらつきで分析すれば、自動化の価値と実現容易性の両方が高い領域が特定でき、双方に説明可能な根拠が得られます。最も紛らわしいのはパスワードリセットから始める案で、実務的にはよくある選択ですが、データを見ずに決めると価値の薄い領域に初期投資を固定するおそれがあります。", "p": "スコープの対立は交渉ではなく既存業務データの分布分析で決着させる。"}, {"d": "D4", "q": "A payments company is ready to roll out a reworked dispute triage assistant. Offline eval is better in every category, and the change moves classification thresholds that downstream systems act on. The team plans a full cutover on Monday with a rollback if anything breaks. What should the architect require?", "o": ["A staged rollout with rollback criteria stated as thresholds on specific online metrics, a defined observation window per stage, and a named person authorized to trigger rollback", "A shadow deployment running on all traffic without acting, compared for two weeks before cutover", "A canary of 5 percent of traffic watched by the on call engineer for anomalies", "A full cutover with the previous version kept warm so rollback takes under a minute", "An extended offline eval over six months of historical disputes before the cutover"], "a": [0], "e": "ロールバックは何かが壊れたらという曖昧な条件ではなく、具体的なオンライン指標の閾値、段階ごとの観測期間、発動権限を持つ担当者として事前に定義されて初めて機能する。分類しきい値が下流の処理に影響する変更では、段階投入で各段の実影響を測りながら進めることが前提になる。5%カナリアは判断基準が当直者の主観に委ねられている点で不十分である。", "p": "出荷判断は事前に定義したロールバック基準と段階と責任者を伴う。"}, {"d": "D3", "q": "A finance assistant is built on RAG over eight years of monthly reporting workbooks converted to text. Users ask questions such as which three regions grew fastest last quarter. Retrieval returns relevant looking pages, but the numbers in the answers are wrong or partial. The team proposes smaller chunks and a better embedding model. What should the architect recommend?", "o": ["Load the workbook figures into a structured store and give the agent query tools over it, keeping RAG only for the narrative commentary", "Reduce chunk size and add overlap so that no table row is ever split across chunks", "Place the entire workbook for the requested period into the prompt instead of retrieved fragments", "Have the model transcribe every retrieved table into markdown before it reasons over the numbers", "Add a reranker specifically tuned on numeric and comparison style queries"], "a": [0], "e": "上位三地域の抽出のような質問は、集計と順位付けという決定論的な演算であり、類似度検索で近い断片を集める方式とは適合しません。数値を構造化ストアに取り込み、集計クエリのツールを与えれば、網羅性も正確性も検索品質に依存しなくなります。最も紛らわしいのはチャンク分割の改善案で、表が途中で切れる問題は緩和されますが、複数期間にまたがる集計を検索で代替できないという本質は残ります。", "p": "集計や順位付けの問いはRAGではなく構造化クエリの領域として切り分ける。"}, {"d": "D1", "q": "A telecom wants an LLM to answer questions inside its voice IVR. The current IVR budget allows 800 milliseconds from the end of caller speech to the start of the audio response. The proposed design retrieves from three knowledge sources and generates a complete answer, measuring 3.5 seconds at p50. The product manager asks the team to optimize until it fits within 800 milliseconds. What should the architect recommend?", "o": ["Reframe the requirement around time to first audio: begin speaking a short acknowledgement while retrieval and generation continue, and stream the answer as it is produced", "Continue optimizing: cut to one knowledge source, shrink the prompt and use the fastest model until p50 fits within 800 milliseconds", "Pre generate answers for the 200 most common questions and transfer every other call to a human agent", "Keep the existing IVR decision tree and use the model only for post call summarization", "Raise the IVR latency budget to 3.5 seconds and accept the silence on the line"], "a": [0], "e": "800ミリ秒という制約は完成した回答までの時間ではなく、通話中の無音を避けるための最初の発話までの時間として定義し直すのが本質的です。短い受け止めの発話を先に流し、生成をストリーミングで追随させれば、知識源を削らずに体感上の応答性を満たせます。最も紛らわしいのは知識源を一つに削る案で、回答の網羅性を犠牲にしたうえ、全経路で目標を安定的に満たせる保証はありません。", "p": "厳しい遅延要件は完了時間ではなく最初の応答までの時間として再定義する。"}, {"d": "D3", "q": "A shared internal Claude platform serves 12 business units through one organization level quota. One unit launched a bulk summarization job, and now other units' interactive assistants intermittently fail. A request to raise the organization quota is pending with the vendor. What should the architect do first?", "o": ["Introduce per tenant token budgets and priority classes at the gateway so that interactive traffic is admitted ahead of bulk work", "Add exponential backoff with jitter to every client SDK so that failed calls are retried more politely", "Ask the bulk unit to reschedule the job to overnight hours and rely on that agreement", "Issue each business unit its own API key so that consumption becomes attributable per unit", "Place all requests into a single first in first out queue so that no unit can burst ahead of others"], "a": [0], "e": "共有クォータの下では、一つのテナントのバーストが他テナントの対話体験を直接壊すため、公平配分と優先度を入口で強制する必要があります。ゲートウェイでテナント別のトークン予算と優先クラスを設ければ、上限緩和を待たずに対話系トラフィックを保護できます。最も紛らわしいのはバックオフの徹底で、クライアントの行儀は良くなりますが、容量が枯渇している以上、対話系の失敗と待ち時間は残ります。", "p": "共有容量の逼迫はリトライ調整ではなくテナント別予算と優先度で制御する。"}];
var TOTAL = Q.length, LIMIT = 120*60*1000, LTR = "ABCDE";
var DOM = {D1:"Solution Design",D2:"Models & Prompting",D3:"Integration",
D4:"Evaluation & Testing",D5:"Governance & Risk",D6:"Stakeholder & Lifecycle",D7:"Developer Enablement"};
var ORD = ["D3","D1","D4","D5","D6","D2","D7"];
var KEY="ccarp_mock_v1";
var S = null, cur = 0, tick = null, view="start";
var app = document.getElementById("app");

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function clearS(){ try{ localStorage.removeItem(KEY); }catch(e){} }

function left(){ return Math.max(0, S.start + LIMIT - Date.now()); }
